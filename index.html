<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<body>
<title>Caderno de MC358</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Gochi+Hand&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&display=swap">
<style>
/* Mesmo caderno do jogo de MC322: quadriculado (claro) / lousa (escuro), abas como orelhas, quiz numa folha central */
:root {
  --paper: #f7f6fb;
  --grid: rgba(110, 70, 170, 0.08);
  --sheet: #ffffff;
  --fg: #1f1c2c;
  --muted: #625d78;
  --ink: #5b2fb0;
  --marker: #ffe36b;
  --marker-soft: rgba(255, 227, 107, 0.55);
  --red: #c9302c;
  --red-soft: rgba(201, 48, 44, 0.08);
  --green: #1f8a5b;
  --green-soft: rgba(31, 138, 91, 0.1);
  --line: #dedaea;
  --code-bg: #f3f0fa;
  --tag-t: #eae3fb; --tag-t-fg: #5b2fb0;
  --tag-e: #e2f1ff; --tag-e-fg: #1d5fa8;
  --tag-x: #fff0dc; --tag-x-fg: #9a5a00;
  --gold: #e8a91a;
  --shadow: 0 1px 0 rgba(31, 28, 44, 0.06), 0 6px 18px rgba(91, 47, 176, 0.07);
  --f-display: "Gochi Hand", "Comic Sans MS", cursive;
  --f-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-math: "STIX Two Text", "Cambria Math", "Cambria", "Times New Roman", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #1b1a24; --grid: rgba(230, 220, 255, 0.045); --sheet: #24222f; --fg: #ecebf3; --muted: #a9a4bd;
    --ink: #c3a6ff; --marker: #f2cf5b; --marker-soft: rgba(242, 207, 91, 0.22); --red: #ff8a80; --red-soft: rgba(255, 138, 128, 0.1);
    --green: #79dba7; --green-soft: rgba(121, 219, 167, 0.12); --line: #3a3749; --code-bg: #1a1923;
    --tag-t: #352a52; --tag-t-fg: #d2bdff; --tag-e: #1f3349; --tag-e-fg: #9cc9ff; --tag-x: #3f3020; --tag-x-fg: #f5c27a;
    --gold: #f2c14e; --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #1b1a24; --grid: rgba(230, 220, 255, 0.045); --sheet: #24222f; --fg: #ecebf3; --muted: #a9a4bd;
  --ink: #c3a6ff; --marker: #f2cf5b; --marker-soft: rgba(242, 207, 91, 0.22); --red: #ff8a80; --red-soft: rgba(255, 138, 128, 0.1);
  --green: #79dba7; --green-soft: rgba(121, 219, 167, 0.12); --line: #3a3749; --code-bg: #1a1923;
  --tag-t: #352a52; --tag-t-fg: #d2bdff; --tag-e: #1f3349; --tag-e-fg: #9cc9ff; --tag-x: #3f3020; --tag-x-fg: #f5c27a;
  --gold: #f2c14e; --shadow: 0 1px 0 rgba(0,0,0,.3), 0 8px 22px rgba(0,0,0,.25); color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
.app {
  max-width: 1040px;
  margin: 0 auto;
  padding-block: 18px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .opt:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.m sub, .m sup { font-size: .72em; line-height: 0; }
.m { font-family: var(--f-math); font-size: 1.08em; background: var(--code-bg); padding: 0 .3em; border-radius: 4px; overflow-wrap: anywhere; white-space: pre-wrap; }
/* topo */
.top { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 20px; margin-bottom: 16px; }
.brand { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.brand h1 { font-family: var(--f-display); font-weight: 400; font-size: 2.4rem; line-height: 1; margin: 0; color: var(--ink); cursor: pointer; }
.brand .sub { color: var(--muted); font-size: .9rem; }
.hud { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 11px; border: 1.5px solid var(--line); border-radius: 999px; background: var(--sheet); font-size: .86rem; font-variant-numeric: tabular-nums; white-space: nowrap; }
.chip b { color: var(--ink); }
.iconbtn { border: 1.5px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 5px 11px; font-size: .86rem; }
.iconbtn:hover { border-color: var(--ink); }
/* abas */
.tabs { display: flex; gap: 4px; overflow-x: auto; margin-bottom: 22px; border-bottom: 2px solid var(--line); scrollbar-width: thin; }
.tab { flex: none; border: 0; background: transparent; padding: 9px 13px 8px; border-radius: 10px 10px 0 0; font-weight: 700; font-size: .94rem; color: var(--muted); white-space: nowrap; }
.tab:hover { color: var(--fg); }
.tab[aria-selected="true"] { color: var(--ink); background: var(--sheet); box-shadow: inset 0 -3px 0 var(--ink); }
.tab .cnt { font-weight: 400; font-size: .78rem; margin-left: 4px; font-variant-numeric: tabular-nums; }
/* nível */
.levelbar { background: var(--sheet); border: 1.5px solid var(--line); border-radius: 14px; padding: 16px 18px; display: grid; grid-template-columns: 1fr auto; gap: 8px 16px; align-items: center; box-shadow: var(--shadow); margin-bottom: 26px; }
.levelbar .rank { font-family: var(--f-display); font-size: 1.6rem; line-height: 1.1; }
.levelbar .rank small { display: block; font-family: var(--f-body); font-size: .78rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.meter { grid-column: 1 / -1; height: 10px; border-radius: 99px; background: var(--code-bg); overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ink); border-radius: 99px; transition: width .6s ease; }
.levelbar .next { color: var(--muted); font-size: .85rem; text-align: right; font-variant-numeric: tabular-nums; }
/* mapa de capítulos */
.section-h { font-family: var(--f-display); font-weight: 400; font-size: 1.8rem; line-height: 1.15; margin: 0 0 4px; color: var(--fg); text-wrap: balance; }
.section-p { margin: 0 0 14px; color: var(--muted); max-width: 72ch; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; margin: 0 0 18px; }
.fbtn { border: 1.5px solid var(--line); background: var(--sheet); border-radius: 999px; padding: 6px 13px; font-size: .88rem; font-weight: 700; color: var(--muted); }
.fbtn:hover { border-color: var(--ink); color: var(--fg); }
.fbtn[aria-pressed="true"] { border-color: var(--ink); color: var(--ink); background: var(--marker-soft); }
.map { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px; margin-bottom: 30px; }
.page {
  position: relative; text-align: left; border: 1.5px solid var(--line); background: var(--sheet); border-radius: 4px 14px 14px 4px;
  padding: 14px 16px 14px 26px; display: flex; flex-direction: column; gap: 6px; min-height: 170px; box-shadow: var(--shadow);
  transition: transform .15s ease, border-color .15s ease;
}
.page::before { content: ""; position: absolute; left: 12px; top: 10px; bottom: 10px; border-left: 2px dotted var(--line); }
.page:hover { transform: translateY(-3px) rotate(-.4deg); border-color: var(--ink); }
.page .num { font-family: var(--f-display); font-size: 2rem; line-height: 1; color: var(--ink); }
.page .num small { font-family: var(--f-body); font-size: .78rem; color: var(--muted); margin-left: 6px; letter-spacing: .04em; }
.page .name { font-weight: 700; font-size: 1.02rem; line-height: 1.25; }
.page .desc { color: var(--muted); font-size: .84rem; line-height: 1.35; flex: 1; }
.page .foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: .8rem; color: var(--muted); flex-wrap: wrap; }
.page.done .num { background: linear-gradient(transparent 55%, var(--marker-soft) 55%); align-self: flex-start; padding: 0 4px; }
.counts { display: flex; gap: 4px; flex-wrap: wrap; }
.stars { letter-spacing: 2px; font-size: 1.05rem; color: var(--line); }
.stars .on { color: var(--gold); }
.tagu { font-size: .68rem; font-weight: 700; letter-spacing: .05em; padding: 2px 7px; border-radius: 5px; white-space: nowrap; }
.tagu.T { background: var(--tag-t); color: var(--tag-t-fg); }
.tagu.E { background: var(--tag-e); color: var(--tag-e-fg); }
.tagu.X { background: var(--tag-x); color: var(--tag-x-fg); }
.extras { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.card { background: var(--sheet); border: 1.5px solid var(--line); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 8px; }
.card h3 { margin: 0; font-size: 1.05rem; }
.card p { margin: 0; color: var(--muted); font-size: .9rem; flex: 1; }
.btn { border: 2px solid var(--ink); background: var(--ink); color: var(--sheet); border-radius: 10px; padding: 9px 16px; font-weight: 700; align-self: flex-start; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--ink); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.howto { margin-top: 26px; color: var(--muted); font-size: .86rem; display: flex; flex-wrap: wrap; gap: 6px 18px; }
kbd { font-family: var(--f-body); font-size: .8em; border: 1.5px solid var(--line); border-bottom-width: 3px; border-radius: 5px; padding: 0 5px; background: var(--sheet); }
/* lista de erros */
.qlist { display: grid; gap: 8px; margin-bottom: 18px; }
.qrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; text-align: left; width: 100%; border: 1.5px solid var(--line); background: var(--sheet); border-radius: 10px; padding: 10px 14px; }
.qrow:hover { border-color: var(--ink); }
.qrow .qt { min-width: 0; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: .93rem; line-height: 1.35; }
.qrow .side { display: flex; gap: 6px; align-items: center; color: var(--muted); font-size: .78rem; }
.empty { background: var(--sheet); border: 1.5px dashed var(--line); border-radius: 14px; padding: 22px; color: var(--muted); text-align: center; }
/* quiz */
.quizhead { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
.quizhead .title { font-family: var(--f-display); font-size: 1.6rem; line-height: 1.1; flex: 1; min-width: 0; }
.progress { display: flex; gap: 3px; margin-bottom: 16px; }
.progress span { flex: 1; height: 7px; border-radius: 99px; background: var(--line); }
.progress span.ok { background: var(--green); }
.progress span.bad { background: var(--red); }
.progress span.cur { background: var(--ink); }
.sheet { background: var(--sheet); border: 1.5px solid var(--line); border-radius: 16px; padding: clamp(14px, 4vw, 30px); box-shadow: var(--shadow); max-width: 900px; margin: 0 auto; }
.qmeta { display: flex; justify-content: space-between; align-items: center; gap: 6px 10px; flex-wrap: wrap; font-size: .76rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); margin-bottom: 10px; }
.qtext { font-size: 1.14rem; line-height: 1.5; font-weight: 700; margin: 0 0 14px; text-wrap: pretty; }
.qtext .qnum { font-family: var(--f-display); font-weight: 400; color: var(--ink); font-size: 1.3em; margin-right: 6px; }
.lead { font-size: .86rem; color: var(--muted); margin: -6px 0 12px; }
.opts { display: grid; gap: 10px; }
.opt {
  display: grid; grid-template-columns: 34px minmax(0, 1fr); gap: 12px; align-items: start; text-align: left; width: 100%;
  border: 2px solid var(--line); background: var(--sheet); border-radius: 12px; padding: 11px 14px; line-height: 1.45;
  transition: border-color .12s ease, background .12s ease;
}
.opt .l { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 700; font-size: .9rem; color: var(--muted); }
.opt .t { min-width: 0; overflow-wrap: anywhere; padding-top: 3px; }
.opt:not(:disabled):hover { border-color: var(--ink); background: var(--marker-soft); }
.opt:disabled { cursor: default; }
.opt.wrong { border-color: var(--red); background: var(--red-soft); color: var(--muted); }
.opt.wrong .t { text-decoration: line-through; text-decoration-color: var(--red); text-decoration-thickness: 2px; }
.opt.wrong .l { border-color: var(--red); color: var(--red); }
.opt.right { border-color: var(--green); background: var(--green-soft); }
.opt.right .l { border-color: var(--green); background: var(--green); color: var(--sheet); }
.opt.right .t { background: linear-gradient(transparent 60%, var(--marker-soft) 60%); }
.hint { margin-top: 14px; border-left: 4px solid var(--gold); background: var(--marker-soft); border-radius: 0 10px 10px 0; padding: 8px 12px; font-size: .92rem; }
.ref { margin-top: 16px; font-size: .84rem; color: var(--muted); border-top: 1.5px dashed var(--line); padding-top: 10px; }
.ref b { color: var(--fg); }
.shake { animation: shake .35s ease; }
@keyframes shake { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
.feedback { margin-top: 16px; border-radius: 12px; padding: 12px 16px; font-size: .95rem; }
.feedback.bad { background: var(--red-soft); border: 1.5px dashed var(--red); }
.feedback.good { background: var(--green-soft); border: 1.5px solid var(--green); }
.feedback .who { font-family: var(--f-display); font-size: 1.35rem; line-height: 1.1; display: block; margin-bottom: 4px; }
.feedback.bad .who { color: var(--red); }
.feedback.good .who { color: var(--green); }
.actions { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
.combo { font-family: var(--f-display); font-size: 1.3rem; color: var(--muted); }
.combo.hot { color: #e8771a; }
.floatxp { position: fixed; pointer-events: none; font-family: var(--f-display); font-size: 1.6rem; color: var(--green); animation: up 1s ease forwards; z-index: 20; }
@keyframes up { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-50px); } }
/* resultado */
.result { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.result h2 { font-family: var(--f-display); font-weight: 400; font-size: 2.6rem; line-height: 1; margin: 6px 0 0; color: var(--ink); text-wrap: balance; }
.result .bigstars { font-size: 2.6rem; letter-spacing: 6px; color: var(--line); }
.result .bigstars .on { color: var(--gold); }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; width: 100%; max-width: 480px; margin: 8px 0; }
.stat { border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 8px; }
.stat b { display: block; font-size: 1.5rem; font-variant-numeric: tabular-nums; color: var(--fg); }
.stat span { font-size: .76rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.result .row { justify-content: center; }
.result p { margin: 0; color: var(--muted); max-width: 52ch; }
.confirm { margin-top: 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; font-size: .9rem; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 30; }
@media (max-width: 520px) {
  .brand h1 { font-size: 2rem; }
  .brand .sub { display: none; }
  .qtext { font-size: 1.03rem; }
  .levelbar { grid-template-columns: 1fr; }
  .levelbar .next { text-align: left; }
  .quizhead .title { font-size: 1.3rem; }
  .opt { grid-template-columns: 28px minmax(0, 1fr); gap: 9px; padding: 10px 11px; }
  .opt .l { width: 26px; height: 26px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>

<div class="app">
  <header class="top">
    <div class="brand">
      <h1 id="home" title="Voltar ao início">Caderno de MC358</h1>
      <span class="sub">Matemática Discreta com Rosen e Gersting</span>
    </div>
    <div class="hud">
      <span class="chip">XP <b id="hud-xp">0</b></span>
      <span class="chip">Combo <b id="hud-combo">0</b></span>
      <button class="iconbtn" id="btn-som" type="button" aria-pressed="true">Som: ligado</button>
      <button class="iconbtn" id="btn-tema" type="button">Tema</button>
    </div>
  </header>
  <nav class="tabs" id="tabs" role="tablist" aria-label="Seções"></nav>
  <main id="view" aria-live="polite"></main>
</div>

<script>
// ---------- Livros (cada capítulo vive em src/livro1-rosen/ ou src/livro2-gersting/ e chama capitulo()) ----------
const LIVROS = {
  rosen: {
    id: "rosen", aba: "Livro 1 · Rosen", curto: "Rosen",
    titulo: "Matemática Discreta e Suas Aplicações", autor: "Kenneth H. Rosen", edicao: "6ª edição (McGraw-Hill/AMGH)",
    caps: []
  },
  gersting: {
    id: "gersting", aba: "Livro 2 · Gersting", curto: "Gersting",
    titulo: "Fundamentos Matemáticos para a Ciência da Computação", autor: "Judith L. Gersting", edicao: "7ª edição (LTC)",
    caps: []
  }
};
function capitulo(livro, cap) { LIVROS[livro].caps.push(cap); }

// Rosen, Cap. 1 · Os Fundamentos: Lógica e Demonstrações (Seções 1.1–1.7)
// t: "T" teoria · "E" exemplo resolvido · "X" exercício resolvido. o[0] é sempre a correta (o jogo embaralha).
capitulo("rosen", {
  num: 1, nome: "Lógica e Demonstrações", secoes: "1.1–1.7",
  desc: "Proposições, equivalências, predicados, quantificadores, regras de inferência e métodos de demonstração.",
  qs: [
    { t: "T", sec: "1.1", q: "Sobre o condicional `p → q`, qual afirmação é rigorosamente correta?",
      o: ["É falso somente quando `p` é verdadeiro e `q` é falso; se `p` é falso, o condicional é verdadeiro (por vacuidade).",
          "É verdadeiro somente quando `p` e `q` têm o mesmo valor-verdade.",
          "É falso sempre que `p` é falso, pois nada se pode concluir de uma hipótese falsa.",
          "É logicamente equivalente à sua recíproca `q → p`."],
      exp: "Pela tabela-verdade, `p → q` só falha na linha `p = V, q = F`. “Mesmo valor-verdade” descreve o bicondicional `p ↔ q`, e a recíproca não é equivalente (basta `p = F, q = V`).",
      dica: "Uma promessa só é quebrada quando a condição acontece e o prometido não." },
    { t: "T", sec: "1.1", q: "Qual proposição é logicamente equivalente a `p → q`?",
      o: ["A contrapositiva `¬q → ¬p`.", "A recíproca `q → p`.", "A inversa `¬p → ¬q`.", "A conjunção `¬p ∧ q`."],
      exp: "`p → q ≡ ¬p ∨ q ≡ q ∨ ¬p ≡ ¬q → ¬p`. A recíproca e a inversa são equivalentes entre si (uma é a contrapositiva da outra), mas não ao condicional original.",
      dica: "Troque e negue os dois lados." },
    { t: "T", sec: "1.2", q: "Uma proposição composta é uma tautologia quando:",
      o: ["É verdadeira para toda atribuição de valores-verdade às suas variáveis proposicionais.",
          "É verdadeira para pelo menos uma atribuição de valores-verdade.",
          "É logicamente equivalente à sua própria negação.",
          "Não contém o conectivo de negação."],
      exp: "Tautologia = sempre verdadeira. “Pelo menos uma atribuição” é a definição de satisfatível; uma proposição equivalente à sua negação é impossível.",
      dica: "Pense em `p ∨ ¬p`." },
    { t: "T", sec: "1.2", q: "Por que `p ≡ q` (equivalência lógica) é diferente de `p ↔ q` (bicondicional)?",
      o: ["`p ↔ q` é uma proposição que pode ser V ou F; `p ≡ q` é a afirmação (metalinguística) de que `p ↔ q` é uma tautologia.",
          "São sinônimos: ambos denotam a mesma proposição composta.",
          "`p ≡ q` vale quando `p` e `q` são ambas verdadeiras; `p ↔ q` exige que sejam ambas falsas.",
          "`p ↔ q` só se aplica a proposições atômicas, e `≡` a proposições compostas."],
      exp: "O Rosen define: `p` e `q` são logicamente equivalentes se `p ↔ q` é tautologia. O símbolo `≡` não é um conectivo, e sim uma relação entre proposições.",
      dica: "Um deles é um conectivo; o outro afirma algo sobre todas as linhas da tabela." },
    { t: "T", sec: "1.3", q: "Pelas leis de De Morgan para quantificadores, `¬∀x (P(x) → Q(x))` é equivalente a:",
      o: ["`∃x (P(x) ∧ ¬Q(x))`", "`∀x (P(x) ∧ ¬Q(x))`", "`∃x (¬P(x) → ¬Q(x))`", "`∀x (¬P(x) ∨ Q(x))`"],
      exp: "`¬∀x R(x) ≡ ∃x ¬R(x)` e `¬(P → Q) ≡ P ∧ ¬Q`. Juntando: existe um `x` com `P(x)` verdadeiro e `Q(x)` falso, ou seja, um contraexemplo.",
      dica: "Negar “para todo” é exibir um contraexemplo." },
    { t: "T", sec: "1.4", q: "No domínio dos números reais, compare `∀x ∃y (x + y = 0)` e `∃y ∀x (x + y = 0)`.",
      o: ["A primeira é verdadeira (tome `y = −x`), a segunda é falsa (nenhum `y` fixo anula todo `x`).",
          "Ambas são verdadeiras, pois a ordem dos quantificadores não importa.",
          "Ambas são falsas, pois `y` depende de `x`.",
          "A primeira é falsa e a segunda é verdadeira, com `y = 0`."],
      exp: "Em `∀x∃y`, o `y` pode depender de `x`. Em `∃y∀x`, um único `y` serviria para todos os `x`: com `x = 0` teríamos `y = 0`, mas então `x = 1` falha.",
      dica: "Quantificadores diferentes aninhados não comutam." },
    { t: "T", sec: "1.5", q: "A forma de argumento `[(p → q) ∧ ¬q] → ¬p` corresponde a qual regra de inferência?",
      o: ["Modus tollens", "Modus ponens", "Silogismo hipotético", "Silogismo disjuntivo"],
      exp: "Modus tollens nega o consequente para negar o antecedente. Modus ponens é `[(p → q) ∧ p] → q`.",
      dica: "“Tollens” = remover; aqui se nega a conclusão." },
    { t: "T", sec: "1.5", q: "“Se `n` é um primo maior que 2, então `n` é ímpar. `n` é ímpar. Logo, `n` é primo maior que 2.” O raciocínio:",
      o: ["É falacioso: afirma o consequente, pois `[(p → q) ∧ q] → p` não é tautologia (ex.: `n = 9`).",
          "É válido por modus ponens.",
          "É válido por modus tollens, pois `n` ímpar nega “`n` par”.",
          "É falacioso por negar a hipótese, `[(p → q) ∧ ¬p] → ¬q`."],
      exp: "Com `p` falso e `q` verdadeiro as premissas são verdadeiras e a conclusão é falsa; `n = 9` é ímpar e não é primo.",
      dica: "Procure um ímpar que não seja primo." },
    { t: "T", sec: "1.6", q: "Em uma prova por contraposição de `p → q`, o que se faz?",
      o: ["Supõe-se `¬q` e, por passos válidos, conclui-se `¬p`.",
          "Supõe-se `q` e conclui-se `p`.",
          "Supõe-se `¬p` e conclui-se `¬q`.",
          "Supõe-se `p` e conclui-se `q` sem hipóteses adicionais."],
      exp: "Prova-se `¬q → ¬p` diretamente, que é equivalente a `p → q`. Supor `q` e concluir `p` provaria a recíproca; supor `¬p` e concluir `¬q` provaria a inversa.",
      dica: "A contrapositiva é equivalente; a recíproca não." },
    { t: "T", sec: "1.6", q: "O que é uma prova vacuosa de `p → q`?",
      o: ["Mostrar que `p` é falsa; então `p → q` é verdadeira qualquer que seja `q`.",
          "Mostrar que `q` é verdadeira; então `p → q` é verdadeira qualquer que seja `p`.",
          "Mostrar que `p` e `q` são ambas falsas.",
          "Mostrar que não existe contraexemplo testando casos pequenos."],
      exp: "Vacuosa: hipótese falsa. Mostrar `q` verdadeira é a prova trivial. Testar casos pequenos não prova uma afirmação universal.",
      dica: "Uma é vacuosa, a outra é trivial: qual olha para a hipótese?" },
    { t: "T", sec: "1.7", q: "Qual é a diferença entre uma prova de existência construtiva e uma não construtiva de `∃x P(x)`?",
      o: ["A construtiva exibe um `a` específico com `P(a)`; a não construtiva prova a existência sem indicar qual elemento a satisfaz.",
          "A construtiva usa indução; a não construtiva usa contradição.",
          "A não construtiva só vale para domínios finitos.",
          "A construtiva prova `∀x P(x)` e daí deduz `∃x P(x)`."],
      exp: "Ex. clássico do Rosen: existem irracionais `x, y` com `x^y` racional. Considera-se `√2^√2`: se for racional, serve; se não, `(√2^√2)^√2 = 2` serve. Não se sabe qual caso ocorre: prova não construtiva.",
      dica: "Uma entrega a testemunha; a outra só garante que ela existe." },

    { t: "E", sec: "1.1", q: "Traduza para lógica: “Você pode acessar a Internet do campus somente se for aluno de Ciência da Computação ou não for calouro”, com `a`: acessa, `c`: é aluno de CC, `f`: é calouro.",
      o: ["“`p` somente se `q`” significa `p → q` (`q` é condição necessária). Aqui `p` = `a` e `q` = `c ∨ ¬f`. Resultado: `a → (c ∨ ¬f)`.",
          "“Somente se” indica que a condição vem primeiro, então a condição implica o acesso. Resultado: `(c ∨ ¬f) → a`.",
          "“Somente se” é sempre um bicondicional, pois exclui outros casos. Resultado: `a ↔ (c ∨ ¬f)`.",
          "A negação de “calouro” se distribui sobre a disjunção, logo o acesso exige `¬(c ∨ f)`. Resultado: `a → ¬(c ∨ f)`."],
      exp: "Este é um exemplo da Seção 1.1. “Somente se” marca a condição necessária, que fica no consequente. A frase não diz que ser de CC garante o acesso.",
      dica: "Quem vem depois de “somente se” é condição necessária." },
    { t: "E", sec: "1.2", q: "Mostre que `¬(p ∨ (¬p ∧ q)) ≡ ¬p ∧ ¬q` usando equivalências.",
      o: ["De Morgan: `¬p ∧ ¬(¬p ∧ q)`; De Morgan + dupla negação: `¬p ∧ (p ∨ ¬q)`; distributiva: `(¬p ∧ p) ∨ (¬p ∧ ¬q)`; `¬p ∧ p ≡ F`, identidade: `¬p ∧ ¬q`.",
          "De Morgan: `¬p ∨ ¬(¬p ∧ q)`; De Morgan: `¬p ∨ (p ∨ ¬q)`; associativa: `(¬p ∨ p) ∨ ¬q ≡ V`. Resultado: é tautologia, não `¬p ∧ ¬q`.",
          "Absorção direta: `p ∨ (¬p ∧ q) ≡ p`, logo a expressão vale `¬p`. Resultado: `¬p`.",
          "Distributiva primeiro: `(p ∨ ¬p) ∧ (p ∨ q) ≡ p ∨ q`, cuja negação por De Morgan é `¬p ∨ ¬q`. Resultado: `¬p ∨ ¬q`."],
      exp: "A cadeia correta é a do exemplo da Seção 1.2. A alternativa “distributiva primeiro” começa bem (`p ∨ q`), mas erra De Morgan: `¬(p ∨ q) ≡ ¬p ∧ ¬q`, não `¬p ∨ ¬q`.",
      dica: "De Morgan troca `∨` por `∧` e nega cada parte." },
    { t: "E", sec: "1.4", q: "Com domínio = todas as pessoas, `S(x)`: “x é estudante desta turma” e `C(x)`: “x estudou cálculo”, expresse “Todo estudante desta turma estudou cálculo”.",
      o: ["Quantificador universal com restrição se faz com condicional: para todo `x`, se `x` é da turma então estudou cálculo. Resultado: `∀x (S(x) → C(x))`.",
          "“Todo” pede conjunção: todo `x` é da turma e estudou cálculo. Resultado: `∀x (S(x) ∧ C(x))`.",
          "Basta um estudante, então usa-se o existencial com condicional. Resultado: `∃x (S(x) → C(x))`.",
          "Universal e restrição se combinam com bicondicional. Resultado: `∀x (S(x) ↔ C(x))`."],
      exp: "`∀x (S(x) ∧ C(x))` afirmaria que toda pessoa é da turma. `∀x (S(x) ↔ C(x))` diria que só os da turma estudaram cálculo. Regra: `∀` com `→`, `∃` com `∧`.",
      dica: "`∀` combina com `→`; `∃` combina com `∧`." },
    { t: "E", sec: "1.5", q: "Premissas: “Se chover hoje, não teremos churrasco hoje. Se não tivermos churrasco hoje, teremos amanhã.” Que conclusão se obtém e por qual regra?",
      o: ["Com `r`: chove, `b`: churrasco hoje, `t`: churrasco amanhã, temos `r → ¬b` e `¬b → t`. Silogismo hipotético: `r → t` (“Se chover hoje, teremos churrasco amanhã”).",
          "De `r → ¬b` e `¬b → t`, por modus ponens, `t`: “Teremos churrasco amanhã”.",
          "Por modus tollens, `¬r`: “Não vai chover hoje”.",
          "Por silogismo disjuntivo, `r ∨ t`: “Chove hoje ou teremos churrasco amanhã”."],
      exp: "Modus ponens exigiria saber `r` como premissa, o que não temos. O encadeamento de condicionais é o silogismo hipotético (exemplo da Seção 1.5).",
      dica: "Duas setas que se encaixam." },
    { t: "E", sec: "1.6", q: "Prove diretamente: “se `n` é um inteiro ímpar, então `n²` é ímpar”.",
      o: ["Suponha `n` ímpar: `n = 2k + 1`, `k ∈ ℤ`. Então `n² = 4k² + 4k + 1 = 2(2k² + 2k) + 1`, com `2k² + 2k ∈ ℤ`. Logo `n²` é ímpar.",
          "Suponha `n²` ímpar: `n² = 2k + 1`; então `n = √(2k+1)`, que é ímpar. Logo vale.",
          "Teste `n = 1, 3, 5`: `1, 9, 25` são ímpares. Como não há contraexemplo, vale para todo ímpar.",
          "Suponha `n` par: `n = 2k`, `n² = 4k²` é par. Logo `n` ímpar implica `n²` ímpar."],
      exp: "A segunda prova a recíproca (e de forma não rigorosa). A terceira é verificação de casos, não prova. A quarta prova a inversa (“`n` par → `n²` par”), que não é equivalente.",
      dica: "Prova direta: assuma a hipótese e use a definição de ímpar." },
    { t: "E", sec: "1.6", q: "Prove que `√2` é irracional.",
      o: ["Por contradição: suponha `√2 = a/b` com `mdc(a, b) = 1`. Então `a² = 2b²`, logo `a` é par, `a = 2c`; daí `b² = 2c²` e `b` também é par, contradizendo `mdc(a, b) = 1`.",
          "Por contraposição: se `√2` fosse racional, sua expansão decimal seria finita; como `1,41421…` não termina, é irracional.",
          "Diretamente: `√2 ≈ 1,4142` não é inteiro, e todo racional entre 1 e 2 é inteiro. Logo é irracional.",
          "Por contradição: suponha `√2 = a/b`; então `2 = a²/b²`, e como `a²` e `b²` são quadrados perfeitos, `2` seria quadrado perfeito, absurdo."],
      exp: "A segunda falha porque racionais podem ter dízima periódica infinita. A terceira é falsa (há racionais não inteiros entre 1 e 2). A quarta não justifica por que `a²/b² = 2` exigiria 2 quadrado perfeito.",
      dica: "Use a fração na forma irredutível e a paridade." },

    { t: "X", sec: "1.1", q: "Qual é o valor-verdade de “Se `1 + 1 = 3`, então unicórnios existem”?",
      o: ["O antecedente `1 + 1 = 3` é falso; um condicional com antecedente falso é verdadeiro. Resultado: verdadeira.",
          "O consequente é falso (unicórnios não existem), logo o condicional é falso. Resultado: falsa.",
          "Antecedente e consequente são ambos falsos, e `F → F` é falso. Resultado: falsa.",
          "Não há relação causal entre as partes, logo não é uma proposição. Resultado: indefinida."],
      exp: "Em lógica matemática o condicional não exige relação de causa. `F → F` é verdadeiro.",
      dica: "Olhe só para a tabela-verdade." },
    { t: "X", sec: "1.2", q: "Mostre que `(p ∧ q) → (p ∨ q)` é uma tautologia.",
      o: ["`≡ ¬(p ∧ q) ∨ (p ∨ q) ≡ (¬p ∨ ¬q) ∨ (p ∨ q) ≡ (¬p ∨ p) ∨ (¬q ∨ q) ≡ V ∨ V ≡ V`. Resultado: tautologia.",
          "`≡ ¬(p ∧ q) ∧ (p ∨ q) ≡ (¬p ∨ ¬q) ∧ (p ∨ q)`, que é falsa para `p = q = V`. Resultado: não é tautologia.",
          "Com `p = V, q = F`: `(V ∧ F) → (V ∨ F) = F → V = F`. Resultado: não é tautologia.",
          "`≡ ¬(p ∧ q) ∨ (p ∨ q) ≡ (¬p ∧ ¬q) ∨ (p ∨ q) ≡ ¬(p ∨ q) ∨ (p ∨ q) ≡ V`. Resultado: tautologia."],
      exp: "A quarta chega ao resultado certo usando De Morgan errado (`¬(p ∧ q)` não é `¬p ∧ ¬q`). A terceira erra a tabela: `F → V` é verdadeiro.",
      dica: "Use `a → b ≡ ¬a ∨ b` e depois associativa/comutativa." },
    { t: "X", sec: "1.4", q: "Negue `∀x ∃y (xy = 1)` (domínio: reais) e diga qual das duas é verdadeira.",
      o: ["Negação: `∃x ∀y (xy ≠ 1)`. Ela é verdadeira (tome `x = 0`); logo a original é falsa.",
          "Negação: `∃x ∀y (xy ≠ 1)`. Ela é falsa, pois todo real tem inverso; logo a original é verdadeira.",
          "Negação: `∀x ∃y (xy ≠ 1)`. Ambas são verdadeiras.",
          "Negação: `∃x ∃y (xy ≠ 1)`. Ela é verdadeira, e a original também."],
      exp: "Cada quantificador troca e o predicado é negado. `0` não tem inverso multiplicativo, então `x = 0` testemunha a negação.",
      dica: "Existe algum real sem inverso multiplicativo?" },
    { t: "X", sec: "1.5", q: "Das premissas `p ∨ q` e `¬p ∨ r`, o que se conclui?",
      o: ["Por resolução (se `p` é V, vale `r`; se `p` é F, vale `q`), conclui-se `q ∨ r`.",
          "Por silogismo disjuntivo, conclui-se `q`.",
          "Por modus ponens, conclui-se `r`.",
          "Cancelando `p` com `¬p`, conclui-se `q ∧ r`."],
      exp: "A regra de resolução do Rosen: `[(p ∨ q) ∧ (¬p ∨ r)] → (q ∨ r)`. Não dá para garantir `q` ou `r` isoladamente.",
      dica: "Separe em casos sobre `p`." },
    { t: "X", sec: "1.7", q: "Prove que, para todo inteiro `n`, `n² + n` é par.",
      o: ["Por casos: se `n = 2k`, `n² + n = 2(2k² + k)`; se `n = 2k + 1`, `n² + n = (2k+1)(2k+2) = 2(2k+1)(k+1)`. Em ambos é par.",
          "Como `n²` e `n` têm a mesma paridade, sua soma é sempre ímpar.",
          "Para `n = 1, 2, 3`, obtemos `2, 6, 12`, todos pares; portanto vale sempre.",
          "`n² + n = n(n + 1)`, e todo produto de inteiros é par."],
      exp: "Alternativamente: `n(n+1)` é produto de consecutivos, um deles par. A quarta generaliza errado (`3·5` é ímpar). A segunda erra a paridade da soma de dois números de mesma paridade.",
      dica: "Prova por casos sobre a paridade de `n`." }
  ]
});

// Rosen, Cap. 2 · Estruturas Básicas: Conjuntos, Funções, Sequências e Somatórios (Seções 2.1–2.4)
capitulo("rosen", {
  num: 2, nome: "Conjuntos, Funções e Somatórios", secoes: "2.1–2.4",
  desc: "Conjuntos e operações, conjunto das partes, funções injetoras/sobrejetoras, piso e teto, sequências, somatórios e cardinalidade.",
  qs: [
    { t: "T", sec: "2.1", q: "Por que `∅ ⊆ A` para todo conjunto `A`?",
      o: ["Porque `∀x (x ∈ ∅ → x ∈ A)` é verdadeira por vacuidade: `x ∈ ∅` é sempre falso.",
          "Porque `∅ ∈ A` para todo conjunto `A`.",
          "Só vale quando `A ≠ ∅`; caso contrário a inclusão não está definida.",
          "Por convenção de notação, sem justificativa lógica."],
      exp: "`A ⊆ B` significa `∀x (x ∈ A → x ∈ B)`. Com `A = ∅`, o antecedente nunca é verdadeiro. Note que `∅ ∈ A` é falso em geral (ex.: `A = {1}`).",
      dica: "Lembre da prova vacuosa do Cap. 1." },
    { t: "T", sec: "2.1", q: "Se `|S| = n`, quantos elementos tem o conjunto das partes `P(S)` e por quê?",
      o: ["`2ⁿ`: cada subconjunto corresponde a decidir, para cada um dos `n` elementos, se ele entra ou não (regra do produto).",
          "`n²`: cada subconjunto é um par de elementos de `S`.",
          "`n!`: cada subconjunto é uma ordenação dos elementos de `S`.",
          "`2ⁿ − 1`: o conjunto vazio não é subconjunto próprio e não conta."],
      exp: "Há 2 escolhas independentes por elemento. `∅` e o próprio `S` estão incluídos em `P(S)`. Ex.: `P(∅) = {∅}` tem `2⁰ = 1` elemento.",
      dica: "Cada elemento: dentro ou fora." },
    { t: "T", sec: "2.3", q: "Uma função `f: A → B` é injetora (um-para-um) quando:",
      o: ["`∀a ∀b (f(a) = f(b) → a = b)`, isto é, elementos distintos têm imagens distintas.",
          "`∀y ∈ B ∃x ∈ A (f(x) = y)`.",
          "`∀a ∀b (a = b → f(a) = f(b))`.",
          "`|A| = |B|`."],
      exp: "A segunda é sobrejetora. A terceira vale para qualquer função (é a própria boa definição). A quarta não basta: há funções não injetoras entre conjuntos de mesmo tamanho.",
      dica: "A condição é sobre imagens iguais forçando argumentos iguais." },
    { t: "T", sec: "2.3", q: "Se `g ∘ f` é injetora (com `f: A → B`, `g: B → C`), o que se pode garantir?",
      o: ["`f` é injetora; `g` não precisa ser.",
          "`g` é injetora; `f` não precisa ser.",
          "`f` e `g` são ambas injetoras.",
          "`g` é sobrejetora."],
      exp: "Se `f(a) = f(b)`, então `g(f(a)) = g(f(b))`, e a injetividade de `g ∘ f` dá `a = b`. Contraexemplo para `g`: `A = {1}`, `B = {1, 2}`, `g(1) = g(2)`: `g ∘ f` é injetora, `g` não.",
      dica: "Suponha `f(a) = f(b)` e aplique `g`." },
    { t: "T", sec: "2.3", q: "Qual identidade sobre piso e teto é válida para todo real `x`?",
      o: ["`⌈x⌉ = −⌊−x⌋`", "`⌊x⌋ + ⌈x⌉ = 2x`", "`⌊2x⌋ = 2⌊x⌋`", "`⌈x + y⌉ = ⌈x⌉ + ⌈y⌉`"],
      exp: "Contraexemplos: `x = 0,5` dá `⌊x⌋ + ⌈x⌉ = 1 = 2x` mas `x = 0,3` dá `1 ≠ 0,6`; `⌊2·0,5⌋ = 1 ≠ 0`; `⌈0,5 + 0,5⌉ = 1 ≠ 2`.",
      dica: "Teste valores com parte fracionária." },
    { t: "T", sec: "2.4", q: "Sobre cardinalidade, qual afirmação está correta?",
      o: ["`ℚ⁺` é enumerável, mas o intervalo `(0, 1)` não é, como mostra o argumento diagonal de Cantor.",
          "`ℤ` tem mais elementos que `ℕ`, pois contém os negativos.",
          "`ℚ` não é enumerável porque entre dois racionais sempre há outro.",
          "Todo subconjunto infinito de `ℝ` é não enumerável."],
      exp: "`ℤ` e `ℚ` são enumeráveis (há bijeção com `ℤ⁺`). Densidade não impede enumerabilidade. `ℕ ⊂ ℝ` é infinito e enumerável.",
      dica: "Lembre do percurso em zigue-zague das frações." },

    { t: "E", sec: "2.2", q: "Prove que `A ∩ (B ∪ C) = (A ∩ B) ∪ (A ∩ C)`.",
      o: ["Por dupla inclusão: se `x ∈ A ∩ (B ∪ C)`, então `x ∈ A` e (`x ∈ B` ou `x ∈ C`), logo `x ∈ A ∩ B` ou `x ∈ A ∩ C`; a recíproca segue os mesmos passos ao contrário. Igualdade provada.",
          "Por diagrama de Venn com três círculos, as regiões coincidem; isso é uma prova completa em qualquer caso.",
          "Tome `A = {1}`, `B = {1}`, `C = ∅`: ambos os lados valem `{1}`. Logo vale em geral.",
          "Por dupla inclusão: mostra-se só `A ∩ (B ∪ C) ⊆ (A ∩ B) ∪ (A ∩ C)`, que basta pois os conjuntos têm a mesma quantidade de elementos."],
      exp: "O Rosen prova pela dupla inclusão (ou tabela de pertinência). Um exemplo não prova a identidade, e uma inclusão só basta se já se sabe que os conjuntos são finitos de mesmo tamanho, o que não é dado.",
      dica: "Igualdade de conjuntos = `⊆` nos dois sentidos." },
    { t: "E", sec: "2.3", q: "Analise `f: ℤ → ℤ`, `f(x) = x²`.",
      o: ["Não é injetora (`f(−1) = f(1) = 1`) nem sobrejetora (`−1` não é imagem de nenhum inteiro).",
          "É injetora, pois `x² = y²` implica `x = y`; não é sobrejetora.",
          "É sobrejetora, pois todo inteiro positivo é um quadrado; não é injetora.",
          "É bijetora em `ℤ`, com inversa `√x`."],
      exp: "`x² = y²` dá `x = ±y`. Nem todo inteiro positivo é quadrado (ex.: 2), e nenhum negativo é. `√x` nem está definida em todo `ℤ`.",
      dica: "Teste `x` e `−x`; teste `2` e `−1` no contradomínio." },
    { t: "E", sec: "2.4", q: "Calcule `∑_{k=50}^{100} k²`, sabendo que `∑_{k=1}^{n} k² = n(n+1)(2n+1)/6`.",
      o: ["Escreva como `∑_{1}^{100} − ∑_{1}^{49}`: `100·101·201/6 − 49·50·99/6 = 338350 − 40425 = 297925`.",
          "Escreva como `∑_{1}^{100} − ∑_{1}^{50}`: `338350 − 42925 = 295425`.",
          "Aplique a fórmula com `n = 100 − 50 = 50`: `50·51·101/6 = 42925`.",
          "Multiplique a média dos extremos pelo número de termos: `(50² + 100²)/2 · 51 = 318750`."],

    { t: "E", sec: "2.3", q: "Quantos bytes são necessários para codificar 100 bits de dados (1 byte = 8 bits)?",

    { t: "X", sec: "2.1", q: "Determine `P({∅})`.",

          "`P({∅}) = {∅, ∅} = {∅}`, pois repetições não contam.",

    { t: "X", sec: "2.3", q: "Mostre que `f: ℤ → ℤ`, `f(x) = x + 1` é bijetora e encontre sua inversa.",

    { t: "X", sec: "2.4", q: "Calcule `∑_{j=0}^{8} 3·2ʲ`.",
      o: ["É geométrica com `a = 3`, `r = 2`, 9 termos: `3(2⁹ − 1)/(2 − 1) = 3·511 = 1533`.",

      exp: "`∑_{j=0}^{n} arʲ = a(rⁿ⁺¹ − 1)/(r − 1)`. De 0 a 8 há 9 termos.",

    { t: "X", sec: "2.2", q: "Para `A = {1, 2, 3, 4, 5}` e `B = {4, 5, 6, 7, 8}`, calcule a diferença simétrica `A ⊕ B`.",
      o: ["`A ⊕ B = (A − B) ∪ (B − A) = {1, 2, 3} ∪ {6, 7, 8} = {1, 2, 3, 6, 7, 8}`.",

// Rosen, Cap. 3 · Os Fundamentos: Algoritmos, Números Inteiros e Matrizes (Seções 3.1–3.8)
capitulo("rosen", {
  num: 3, nome: "Algoritmos, Inteiros e Matrizes", secoes: "3.1–3.8",

  qs: [
    { t: "T", sec: "3.2", q: "Pela definição do Rosen, `f(x)` é `O(g(x))` quando:",

    { t: "T", sec: "3.2", q: "`f(x)` é `Θ(g(x))` se e somente se:",

    { t: "T", sec: "3.3", q: "No pior caso, quantas comparações faz a busca binária em uma lista ordenada de `n` elementos?",

      exp: "Com `n = 2ᵏ`, são `k` divisões ao meio mais as comparações finais: `2k + 2 = 2 log n + 2` no algoritmo do Rosen, que é `Θ(log n)`.",

    { t: "T", sec: "3.4", q: "Pelo algoritmo da divisão, quais são `−11 div 3` e `−11 mod 3`?",

      exp: "O resto precisa satisfazer `0 ≤ r < d`. Por isso o resto não pode ser `−2` (exemplo da Seção 3.4).",

    { t: "T", sec: "3.5", q: "Na prova de Euclides de que há infinitos primos, supõe-se que `p₁, …, pₙ` são todos os primos e considera-se `Q = p₁p₂⋯pₙ + 1`. Qual é o passo-chave?",
      o: ["Nenhum `pⱼ` divide `Q` (sobraria resto 1), mas `Q` tem um fator primo; esse primo não está na lista, contradição.",

          "`Q` é par, então 2 não estava na lista.",

      exp: "`Q` não precisa ser primo (ex.: `2·3·5·7·11·13 + 1 = 30031 = 59·509`). O que importa é que seus fatores primos são novos.",

    { t: "T", sec: "3.4", q: "`a ≡ b (mod m)` significa:",

          "`a` e `b` são ambos múltiplos de `m`.",
          "`a·b` é múltiplo de `m`."],
      exp: "`17 ≡ 5 (mod 6)` pois `6 | 12`. A segunda só vale se `0 ≤ b < m`.",

    { t: "T", sec: "3.8", q: "Ao multiplicar uma matriz `m × k` por uma `k × n` pelo algoritmo usual, quantas multiplicações de inteiros são feitas?",
      o: ["`mkn`: cada uma das `mn` entradas é um produto interno de `k` termos.",

          "`m + k + n`.",

      exp: "Por isso a ordem de multiplicação de várias matrizes (associatividade) importa para o custo.",

    { t: "E", sec: "3.2", q: "Mostre que `f(x) = x² + 2x + 1` é `O(x²)`.",
      o: ["Para `x > 1`: `x² + 2x + 1 ≤ x² + 2x² + x² = 4x²`. Testemunhas `C = 4`, `k = 1`.",

          "`lim (x² + 2x + 1)/x = ∞`, logo é `O(x²)`.",

    { t: "E", sec: "3.6", q: "Calcule `mdc(414, 662)` pelo algoritmo de Euclides.",
      o: ["`662 = 414·1 + 248`; `414 = 248·1 + 166`; `248 = 166·1 + 82`; `166 = 82·2 + 2`; `82 = 2·41`. Último resto não nulo: `2`.",
          "`662 = 414·1 + 248`; `414 = 248·1 + 166`; `248 = 166·1 + 82`; `166 = 82·2 + 2`. O último quociente é `2`, então mdc = 41.",

      exp: "Exemplo da Seção 3.6. O mdc é o último resto não nulo. Na terceira alternativa, 23 não divide 662.",

    { t: "E", sec: "3.6", q: "Encontre a expansão binária de `241`.",
      o: ["Divisões sucessivas por 2: restos `1, 0, 0, 0, 1, 1, 1, 1` (do menos para o mais significativo). Resultado: `(1111 0001)₂`.",
          "Mesmos restos lidos de cima para baixo: `(1000 1111)₂`.",
          "`241 = 128 + 64 + 32 + 16 + 1`, logo `(1111 1001)₂`.",

      exp: "`241 = 128 + 64 + 32 + 16 + 1 = (11110001)₂`. Os restos saem do bit menos significativo para o mais significativo.",
      dica: "Confira: `128 + 64 + 32 + 16 + 1`." },
    { t: "E", sec: "3.6", q: "Exprima `mdc(252, 198) = 18` como combinação linear (Bézout).",

          "`18 = 252 − 198 − 36`, logo `18 = 1·252 − 1·198 − 36`.",

    { t: "X", sec: "3.6", q: "Calcule `3⁶⁴⁴ mod 645`.",

    { t: "X", sec: "3.2", q: "`7n²` é `O(n³)`? E `n³` é `O(7n²)`?",

    { t: "X", sec: "3.7", q: "Cifre `MEET` com a cifra de César `f(p) = (p + 3) mod 26` (A = 0, …, Z = 25).",

// Rosen, Cap. 4 · Indução e Recursão (Seções 4.1–4.5)
capitulo("rosen", {
  num: 4, nome: "Indução e Recursão", secoes: "4.1–4.5",
  desc: "Indução matemática, indução forte, boa ordenação, definições recursivas, indução estrutural e algoritmos recursivos.",
  qs: [
    { t: "T", sec: "4.1", q: "Qual é a forma correta do princípio da indução matemática (domínio `ℤ⁺`)?",
      o: ["`[P(1) ∧ ∀k (P(k) → P(k + 1))] → ∀n P(n)`",
          "`[P(1) ∧ ∀k P(k)] → ∀n P(n + 1)`",
          "`[P(1) ∧ P(2)] → ∀n P(n)`",
          "`[∀k (P(k) → P(k + 1))] → ∀n P(n)`"],
      exp: "Sem o passo base (última opção) a implicação não basta: `P(n): n > n` satisfaz `P(k) → P(k+1)` por vacuidade e é sempre falsa. A segunda assume o que se quer provar.",
      dica: "Base + passo." },
    { t: "T", sec: "4.1", q: "No passo indutivo, o que significa a hipótese de indução?",
      o: ["Supor `P(k)` para um `k` arbitrário fixado e provar `P(k + 1)`; não é supor `∀k P(k)`.",
          "Supor que `P(n)` vale para todo `n`, que é o que se quer provar.",
          "Verificar `P(k)` numericamente para vários `k`.",
          "Supor `P(k + 1)` e deduzir `P(k)`."],
      exp: "Supor `∀n P(n)` seria raciocínio circular. O passo prova o condicional `P(k) → P(k+1)` para todo `k`.",
      dica: "É um condicional para um `k` genérico." },
    { t: "T", sec: "4.2", q: "Na indução forte, a hipótese indutiva é:",
      o: ["`P(1) ∧ P(2) ∧ ⋯ ∧ P(k)`, e mostra-se `P(k + 1)`.",
          "Apenas `P(k)`, como na indução comum.",
          "`P(k + 1)`, e mostra-se `P(k)`.",
          "`P(2k)`, e mostra-se `P(k)`."],
      exp: "Útil quando `P(k + 1)` depende de casos anteriores além de `k`, como na fatoração em primos. Indução forte, comum e o princípio da boa ordenação são equivalentes.",
      dica: "Você pode usar todos os casos anteriores." },
    { t: "T", sec: "4.2", q: "O princípio da boa ordenação afirma que:",
      o: ["Todo subconjunto não vazio de inteiros não negativos tem um menor elemento.",
          "Todo subconjunto de `ℤ` tem um menor elemento.",
          "Todo subconjunto não vazio de `ℚ⁺` tem um menor elemento.",
          "Todo conjunto finito de inteiros tem um maior elemento."],
      exp: "`ℤ` não tem menor elemento, nem `{1/n : n ∈ ℤ⁺} ⊆ ℚ⁺`. O princípio é o que justifica a indução e o algoritmo da divisão.",
      dica: "Em `ℕ` não se desce para sempre." },
    { t: "T", sec: "4.1", q: "Na “prova” de que todos os cavalos têm a mesma cor, onde está o erro?",
      o: ["O passo `P(k) → P(k + 1)` falha para `k = 1`: os conjuntos dos `k` primeiros e dos `k` últimos cavalos não se intersectam quando `k + 1 = 2`.",
          "O passo base `P(1)` é falso.",
          "A indução não vale para conjuntos de cavalos, só para números.",
          "O erro é usar indução forte em vez de indução comum."],
      exp: "O argumento usa um cavalo comum aos dois grupos de `k` para transferir a cor. Com 2 cavalos, os grupos `{1}` e `{2}` não têm cavalo comum.",
      dica: "Teste o passo de 1 para 2." },
    { t: "T", sec: "4.3", q: "Para provar por indução estrutural uma propriedade de todos os elementos de um conjunto definido recursivamente, deve-se:",
      o: ["Provar a propriedade para os elementos do passo base e mostrar que, se vale para os elementos usados na regra recursiva, vale para o novo elemento.",
          "Provar para os elementos de tamanho 1 e 2.",
          "Mostrar que o conjunto é finito.",
          "Provar só a regra recursiva, pois o passo base é sempre trivial."],
      exp: "A indução estrutural segue a forma da definição: base e regra recursiva. É usada, por exemplo, para árvores binárias cheias: `n(T) ≤ 2^(h(T)+1) − 1`.",
      dica: "Siga a própria definição recursiva." },

    { t: "E", sec: "4.1", q: "Prove `1 + 2 + ⋯ + n = n(n + 1)/2`. Como é o passo indutivo?",
      o: ["Supondo `1 + ⋯ + k = k(k+1)/2`, soma-se `k + 1`: `k(k+1)/2 + (k+1) = (k+1)(k+2)/2`, que é `P(k + 1)`.",
          "Supondo `P(k + 1)`, subtrai-se `k + 1` e chega-se a `P(k)`, o que fecha a indução.",
          "Verifica-se `n = 1, 2, 3`, e como a fórmula vale, vale para todos.",
          "Supondo `P(k)`, soma-se `k`: `k(k+1)/2 + k = k(k+3)/2`, que é `P(k + 1)`."],
      exp: "Base: `1 = 1·2/2`. Passo: fatorar `(k+1)` dá `(k+1)(k/2 + 1) = (k+1)(k+2)/2`. A segunda inverte a direção do passo.",
      dica: "O próximo termo da soma é `k + 1`." },
    { t: "E", sec: "4.1", q: "Prove que `n³ − n` é divisível por 3 para todo `n ∈ ℤ⁺`.",
      o: ["Base: `1 − 1 = 0`. Passo: `(k+1)³ − (k+1) = (k³ − k) + 3(k² + k)`; o primeiro termo é divisível por 3 pela HI e o segundo é múltiplo de 3.",
          "Base: `n = 1`. Passo: `(k+1)³ − (k+1) = k³ + 1 − k − 1 = k³ − k`, divisível por 3 pela HI.",
          "Como `n³ − n = n(n−1)(n+1)`, basta testar `n = 1, 2, 3`.",
          "Base: `n = 2` dá 6. Passo: `(k+1)³ − (k+1) = 3k³`, múltiplo de 3."],
      exp: "Exemplo da Seção 4.1. A segunda erra ao expandir `(k+1)³ = k³ + 3k² + 3k + 1`.",
      dica: "Expanda `(k+1)³` corretamente." },
    { t: "E", sec: "4.1", q: "Prove `2ⁿ < n!` para todo inteiro `n ≥ 4`.",
      o: ["Base: `2⁴ = 16 < 24 = 4!`. Passo: `2^(k+1) = 2·2ᵏ < 2·k! < (k+1)·k! = (k+1)!`, pois `2 < k + 1` para `k ≥ 4`.",
          "Base: `n = 1`: `2 < 1`. Passo como de costume.",
          "Base: `2⁴ < 4!`. Passo: `2^(k+1) = 2ᵏ + 2 < k! + 2 < (k+1)!`.",
          "Como `n!` cresce mais rápido que `2ⁿ`, vale para todo `n`."],
      exp: "Exemplo da Seção 4.1. A base precisa ser `n = 4` (para `n = 1, 2, 3` a desigualdade é falsa). `2^(k+1) = 2·2ᵏ`, não `2ᵏ + 2`.",
      dica: "`2^(k+1) = 2·2ᵏ`." },
    { t: "E", sec: "4.2", q: "Prove que todo valor de postagem de `n ≥ 12` centavos pode ser formado com selos de 4 e 5 centavos.",
      o: ["Indução forte. Bases: `12 = 4+4+4`, `13 = 4+4+5`, `14 = 4+5+5`, `15 = 5+5+5`. Passo (`k ≥ 15`): `k + 1 − 4 = k − 3 ≥ 12` tem solução pela HI; some um selo de 4.",
          "Indução comum com base 12. Passo: troque um selo de 4 por um de 5.",
          "Basta mostrar 12 e 13; o resto segue somando 1 centavo.",
          "Indução forte com base `n = 12` somente. Passo: use `P(k − 3)`."],
      exp: "Exemplo da Seção 4.2. Com uma só base, `P(k − 3)` não estaria coberto para `k = 13, 14, 15`. A troca de selo da segunda alternativa precisa de casos (pode não haver selo de 4).",
      dica: "Saltos de 4 exigem 4 casos base." },

    { t: "X", sec: "4.1", q: "Prove que a soma dos `n` primeiros ímpares é `n²`.",
      o: ["Base: `1 = 1²`. Passo: `1 + 3 + ⋯ + (2k−1) + (2k+1) = k² + 2k + 1 = (k+1)²`.",
          "Base: `1 = 1²`. Passo: somar `2k − 1` à HI: `k² + 2k − 1`.",
          "Passo: `(k+1)² − k² = 2k + 1`, logo vale. Não precisa de base.",
          "Base: `n = 0`, `0 = 0²`. Passo: `k² + (2k + 3) = (k+1)² + 2`."],
      exp: "O `(k+1)`-ésimo ímpar é `2(k+1) − 1 = 2k + 1`.",
      dica: "Qual é o `(k+1)`-ésimo número ímpar?" },
    { t: "X", sec: "4.3", q: "Se `f(0) = 3` e `f(n + 1) = 2f(n) + 3`, quanto valem `f(1)`, `f(2)`, `f(3)`, `f(4)`?",
      o: ["`f(1) = 2·3 + 3 = 9`, `f(2) = 21`, `f(3) = 45`, `f(4) = 93`.",
          "`f(1) = 6`, `f(2) = 12`, `f(3) = 24`, `f(4) = 48`.",
          "`f(1) = 9`, `f(2) = 18`, `f(3) = 36`, `f(4) = 72`.",
          "`f(1) = 9`, `f(2) = 21`, `f(3) = 45`, `f(4) = 90`."],
      exp: "Exemplo da Seção 4.3. Em forma fechada: `f(n) = 6·2ⁿ − 3`.",
      dica: "Dobra e soma 3." },
    { t: "X", sec: "4.4", q: "O algoritmo recursivo `potência(a, n)`: se `n = 0` retorna 1; senão retorna `a · potência(a, n − 1)`. Como provar que ele calcula `aⁿ`?",
      o: ["Indução em `n`: base `n = 0` retorna `1 = a⁰`; se `potência(a, k) = aᵏ`, então `potência(a, k+1) = a·aᵏ = a^(k+1)`.",
          "Testar o algoritmo para `n = 0, 1, 2`.",
          "Indução em `a`: base `a = 0` retorna 0.",

      exp: "Exemplo da Seção 4.4: a correção de algoritmos recursivos se prova por indução. Terminação não garante resultado correto.",
      dica: "A recursão está em `n`." }
  ]
});

// Rosen, Cap. 5 · Contagem (Seções 5.1–5.6)
capitulo("rosen", {
  num: 5, nome: "Contagem", secoes: "5.1–5.6",
  desc: "Regras do produto e da soma, casas de pombo, permutações, combinações, coeficientes binomiais e repetições.",
  qs: [
    { t: "T", sec: "5.1", q: "Quando usar a regra do produto em vez da regra da soma?",
      o: ["Produto: a tarefa é uma sequência de etapas (`n₁` maneiras e depois `n₂`). Soma: a tarefa é feita de um modo OU de outro, sendo os modos disjuntos.",
          "Produto quando os conjuntos são disjuntos; soma quando não são.",
          "Produto quando a ordem não importa; soma quando importa.",
          "São intercambiáveis; o resultado é o mesmo."],
      exp: "Regra do produto: `|A₁ × A₂| = |A₁|·|A₂|`. Regra da soma: `|A₁ ∪ A₂| = |A₁| + |A₂|` se `A₁ ∩ A₂ = ∅`; se não forem disjuntos, usa-se a regra da subtração (inclusão-exclusão).",
      dica: "“E depois” vs. “ou”." },
    { t: "T", sec: "5.2", q: "O princípio das casas de pombo generalizado afirma que, se `N` objetos são colocados em `k` caixas:",
      o: ["Alguma caixa contém pelo menos `⌈N/k⌉` objetos.",
          "Alguma caixa contém pelo menos `⌊N/k⌋ + 1` objetos.",
          "Toda caixa contém pelo menos `⌊N/k⌋` objetos.",
          "Alguma caixa contém exatamente `N/k` objetos."],
      exp: "Se todas tivessem no máximo `⌈N/k⌉ − 1` objetos, o total seria `≤ k(⌈N/k⌉ − 1) < k(N/k + 1 − 1) = N`, contradição. A segunda falha quando `k | N` (ex.: `N = 4`, `k = 2`).",
      dica: "Use teto, e teste `N` múltiplo de `k`." },
    { t: "T", sec: "5.3", q: "Qual é a justificativa combinatória de `C(n, r) = C(n, n − r)`?",
      o: ["Escolher os `r` elementos que entram equivale a escolher os `n − r` que ficam de fora: há uma bijeção entre os dois tipos de subconjunto.",
          "Porque `n!/(r!(n−r)!)` é simétrico em `n` e `r`.",
          "Porque ordenar `r` elementos é o mesmo que ordenar `n − r`.",
          "Vale só quando `r = n/2`."],
      exp: "Prova combinatória: contar o mesmo conjunto de duas formas, ou exibir uma bijeção (complemento). A fórmula é simétrica em `r` e `n − r`, não em `n` e `r`.",
      dica: "Complemento de um subconjunto." },
    { t: "T", sec: "5.4", q: "Qual é a identidade de Pascal?",
      o: ["`C(n + 1, k) = C(n, k − 1) + C(n, k)`, para `1 ≤ k ≤ n`.",
          "`C(n + 1, k) = C(n, k) · C(n, k − 1)`.",
          "`C(n, k) = C(n − 1, k − 1) − C(n − 1, k)`.",
          "`C(n + 1, k + 1) = C(n, k) + 1`."],
      exp: "Fixe um elemento `a` de um conjunto com `n + 1` elementos: os `k`-subconjuntos que contêm `a` são `C(n, k−1)`; os que não contêm são `C(n, k)`.",
      dica: "O subconjunto contém ou não um elemento fixo." },
    { t: "T", sec: "5.5", q: "Quantas `r`-combinações com repetição podem ser formadas de um conjunto com `n` elementos?",
      o: ["`C(n + r − 1, r)`, pelo método de estrelas e barras (`r` estrelas e `n − 1` barras).",
          "`nʳ`", "`C(n, r)`", "`P(n + r, r)`"],
      exp: "`nʳ` conta sequências ordenadas com repetição. Com repetição e sem ordem, distribuem-se `r` estrelas entre `n` tipos separados por `n − 1` barras.",
      dica: "Estrelas e barras." },
    { t: "T", sec: "5.5", q: "O número de permutações de `n` objetos com `n₁` indistinguíveis do tipo 1, …, `nₖ` do tipo `k` é:",
      o: ["`n!/(n₁! n₂! ⋯ nₖ!)`", "`n!`", "`n!/k!`", "`C(n, k)`"],
      exp: "Escolhem-se as posições do tipo 1 (`C(n, n₁)`), depois do tipo 2 entre as restantes, e assim por diante; o produto simplifica para o coeficiente multinomial.",

    { t: "E", sec: "5.2", q: "Qual o número mínimo de estudantes para garantir que pelo menos 6 recebam a mesma nota, havendo 5 notas possíveis (A, B, C, D, F)?",
      o: ["Queremos o menor `N` com `⌈N/5⌉ = 6`, isto é, `N = 5·5 + 1 = 26`.",
          "`6·5 = 30`, para cada nota ter 6 alunos.",
          "`5 + 6 = 11`.",
          "`⌈6/5⌉ = 2`."],
      exp: "Exemplo da Seção 5.2. Com 25, pode haver exatamente 5 de cada nota.",
      dica: "Com 25 alunos dá para ter 5 em cada nota." },
    { t: "E", sec: "5.5", q: "Quantas cadeias distintas podem ser formadas com as letras de `SUCCESS`?",
      o: ["7 letras: S×3, C×2, U×1, E×1. Resultado: `7!/(3!·2!·1!·1!) = 5040/12 = 420`.",
          "Todas as letras em ordem: `7! = 5040`.",
          "Só as letras distintas S, U, C, E: `4! = 24`.",
          "`7!/(3!·2!) · 2 = 840`, multiplicando pelas trocas entre U e E."],
      exp: "Exemplo da Seção 5.5. U e E são distintas, então suas trocas já estão em `7!`.",
      dica: "Conte as repetições de cada letra." },
    { t: "E", sec: "5.5", q: "Quantas soluções inteiras não negativas tem `x₁ + x₂ + x₃ = 11`?",
      o: ["Escolher 11 itens de 3 tipos com repetição: `C(3 + 11 − 1, 11) = C(13, 11) = C(13, 2) = 78`.",
          "`C(11, 3) = 165`.",
          "`3¹¹`.",
          "`C(13, 3) = 286`."],
      exp: "Exemplo da Seção 5.5: 11 estrelas e 2 barras, `C(13, 2) = 78`.",
      dica: "Estrelas e barras com 2 barras." },
    { t: "E", sec: "5.4", q: "Qual é o coeficiente de `x¹²y¹³` em `(2x − 3y)²⁵`?",
      o: ["Pelo teorema binomial com `a = 2x`, `b = −3y`, `j = 13`: `C(25, 13)·2¹²·(−3)¹³ = −(25!/(13!·12!))·2¹²·3¹³`.",
          "`C(25, 12)·2¹²·3¹³`, positivo.",
          "`C(25, 13)`.",
          "`C(25, 13)·2¹³·(−3)¹²`."],
      exp: "Exemplo da Seção 5.4. O termo geral é `C(25, j)(2x)^(25−j)(−3y)ʲ`; com `j = 13` o sinal é negativo (expoente ímpar). `C(25, 12) = C(25, 13)`, mas a segunda erra o sinal.",
      dica: "Expoente ímpar em `−3`." },

    { t: "X", sec: "5.1", q: "Quantas cadeias de bits de comprimento 8 começam com `1` ou terminam com `00`?",
      o: ["Começam com 1: `2⁷ = 128`. Terminam com 00: `2⁶ = 64`. Ambos: `2⁵ = 32`. Regra da subtração: `128 + 64 − 32 = 160`.",
          "`128 + 64 = 192`.",
          "`2⁸ − 32 = 224`.",
          "`128 · 64 = 8192`."],
      exp: "Exemplo da Seção 5.1. Sem descontar a interseção, as cadeias que começam com 1 e terminam com 00 seriam contadas duas vezes.",
      dica: "Inclusão-exclusão com dois conjuntos." },
    { t: "X", sec: "5.3", q: "Quantas comissões com 3 professores de Matemática (de 9) e 4 de Computação (de 11) podem ser formadas?",
      o: ["Regra do produto de combinações: `C(9, 3)·C(11, 4) = 84·330 = 27720`.",
          "`C(20, 7) = 77520`.",
          "`P(9, 3)·P(11, 4) = 504·7920`.",
          "`C(9, 3) + C(11, 4) = 414`."],
      exp: "Exemplo da Seção 5.3. As escolhas são independentes (produto) e sem ordem (combinações).",
      dica: "Escolha um grupo E depois o outro." },
    { t: "X", sec: "5.3", q: "Quantas mãos de pôquer (5 cartas) podem ser distribuídas de um baralho de 52 cartas?",
      o: ["A ordem não importa: `C(52, 5) = 52·51·50·49·48/5! = 2598960`.",
          "`P(52, 5) = 311875200`.",
          "`52⁵`.",
          "`C(52, 5)·5! = 311875200`."],
      exp: "Exemplo da Seção 5.3. `P(52, 5)` conta a ordem em que as cartas foram recebidas.",
      dica: "Uma mão é um conjunto de cartas." },
    { t: "X", sec: "5.5", q: "De quantas maneiras escolher 4 frutas de uma cesta com maçãs, laranjas e peras (pelo menos 4 de cada, frutas do mesmo tipo indistinguíveis)?",
      o: ["Combinação com repetição, `n = 3`, `r = 4`: `C(3 + 4 − 1, 4) = C(6, 4) = 15`.",
          "`3⁴ = 81`.",
          "`C(3, 4) = 0`, pois `4 > 3`.",
          "`C(12, 4) = 495`, considerando 12 frutas."],
      exp: "Exemplo da Seção 5.5. Frutas iguais são indistinguíveis e a ordem não importa.",
      dica: "Repetição permitida, ordem irrelevante." }
  ]
});

// Rosen, Cap. 6 · Probabilidade Discreta (Seções 6.1–6.4)
capitulo("rosen", {
  num: 6, nome: "Probabilidade Discreta", secoes: "6.1–6.4",
  desc: "Probabilidade de Laplace, complemento, condicional, independência, Bernoulli, Bayes, esperança e variância.",
  qs: [
    { t: "T", sec: "6.1", q: "Na definição de Laplace, a probabilidade de um evento `E` em um espaço amostral finito `S` é `|E|/|S|`. Qual hipótese é essencial?",
      o: ["Todos os resultados de `S` são igualmente prováveis.", "`E` e `S` são disjuntos.", "`S` é infinito.", "`E` tem pelo menos dois elementos."],
      exp: "Sem equiprobabilidade, usa-se a definição geral: `p(E) = ∑_{s ∈ E} p(s)`.",
      dica: "Resultados com a mesma chance." },
    { t: "T", sec: "6.2", q: "Dois eventos `E` e `F` são independentes quando:",
      o: ["`p(E ∩ F) = p(E)·p(F)`.", "`E ∩ F = ∅`.", "`p(E ∪ F) = p(E) + p(F)`.", "`p(E | F) = p(F | E)`."],
      exp: "Independência ≠ disjunção. Eventos disjuntos com probabilidade positiva são dependentes: se `E` ocorre, `F` certamente não ocorre.",
      dica: "Saber que `F` ocorreu não muda a chance de `E`." },
    { t: "T", sec: "6.3", q: "O teorema de Bayes afirma que `p(F | E)` é igual a:",
      o: ["`p(E | F)p(F) / [p(E | F)p(F) + p(E | F̄)p(F̄)]`", "`p(E | F)`", "`p(E)p(F)`", "`p(E | F)p(E) / p(F)`"],
      exp: "Numerador: `p(E ∩ F)`. Denominador: `p(E)` pela lei da probabilidade total sobre `F` e `F̄`.",
      dica: "Inverte o condicionamento usando probabilidade total." },
    { t: "T", sec: "6.4", q: "Sobre esperança e variância de variáveis aleatórias `X` e `Y`:",
      o: ["`E(X + Y) = E(X) + E(Y)` sempre; `V(X + Y) = V(X) + V(Y)` exige, por exemplo, independência.",
          "Ambas as igualdades exigem independência.",
          "Ambas valem sempre.",
          "`E(XY) = E(X)E(Y)` vale sempre."],
      exp: "A linearidade da esperança não exige independência. `E(XY) = E(X)E(Y)` e a aditividade da variância valem para independentes (o Teorema de Bienaymé no Rosen).",
      dica: "A linearidade da esperança é incondicional." },
    { t: "T", sec: "6.2", q: "Em `n` ensaios de Bernoulli independentes com probabilidade de sucesso `p`, a probabilidade de exatamente `k` sucessos é:",
      o: ["`C(n, k) pᵏ (1 − p)^(n−k)`", "`pᵏ (1 − p)^(n−k)`", "`C(n, k) pᵏ`", "`k/n`"],
      exp: "Cada sequência com `k` sucessos tem probabilidade `pᵏqⁿ⁻ᵏ`, e há `C(n, k)` dessas sequências.",
      dica: "Quantas sequências têm `k` sucessos?" },

    { t: "E", sec: "6.1", q: "Qual a probabilidade de a soma de dois dados ser 7?",
      o: ["Espaço com 36 pares equiprováveis; somam 7: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1). Resultado: `6/36 = 1/6`.",
          "Somas possíveis: 2 a 12, são 11 valores, logo `1/11`.",
          "Pares não ordenados que somam 7: {1,6}, {2,5}, {3,4}; logo `3/21 = 1/7`.",
          "`1/6 · 1/6 = 1/36`."],
      exp: "Exemplo da Seção 6.1. As somas 2 a 12 não são equiprováveis, nem os pares não ordenados.",
      dica: "Os resultados equiprováveis são pares ordenados." },
    { t: "E", sec: "6.2", q: "Uma cadeia de 4 bits é gerada ao acaso. Qual a probabilidade de conter dois 0s consecutivos, dado que o primeiro bit é 0?",
      o: ["`F`: primeiro bit 0, `|F| = 8`. Em `F`, contêm `00`: 0000, 0001, 0010, 0011, 0100, 5 cadeias. `p(E | F) = 5/8`.",
          "`E` tem 8 cadeias de 16, logo `p(E) = 1/2`.",
          "`p(E | F) = p(E)·p(F) = (8/16)(8/16) = 1/4`.",
          "Cadeias com `00` e primeiro bit 0: 4. Resultado: `4/8 = 1/2`."],
      exp: "Exemplo da Seção 6.2: `p(E | F) = p(E ∩ F)/p(F) = (5/16)/(8/16) = 5/8`. A terceira assume independência sem justificar.",
      dica: "Liste as 8 cadeias que começam com 0." },
    { t: "E", sec: "6.3", q: "Uma doença atinge 1 em 100.000 pessoas. O teste dá positivo para 99% dos doentes e para 0,5% dos sadios. Dado um positivo, qual a chance de a pessoa estar doente?",
      o: ["Bayes: `0,99·0,00001 / (0,99·0,00001 + 0,005·0,99999) ≈ 0,002`. Só cerca de 0,2%.",
          "A sensibilidade é 99%, logo a chance é 0,99.",
          "`1 − 0,005 = 0,995`.",
          "`0,99 · 0,00001 ≈ 0,00001`."],
      exp: "Exemplo da Seção 6.3: como a doença é rara, quase todos os positivos são falsos positivos.",
      dica: "Compare doentes positivos com sadios positivos." },
    { t: "E", sec: "6.4", q: "Qual o valor esperado da soma de dois dados honestos?",
      o: ["Por linearidade: `E(X₁ + X₂) = E(X₁) + E(X₂) = 7/2 + 7/2 = 7`.",
          "A soma mais frequente é 7, mas a esperança é `(2 + 12)/2 = 7` só por coincidência; o valor certo é `6`.",
          "`E = 7/2`, pois é a média de um dado.",
          "`E = (7/2)² = 49/4`."],
      exp: "Exemplo da Seção 6.4. Cada dado tem esperança `(1 + ⋯ + 6)/6 = 7/2`.",
      dica: "Use linearidade." },

    { t: "X", sec: "6.2", q: "Uma moeda viciada dá cara com probabilidade `2/3`. Qual a probabilidade de exatamente 4 caras em 7 lançamentos?",
      o: ["Binomial: `C(7, 4)(2/3)⁴(1/3)³ = 35·16/2187 = 560/2187 ≈ 0,256`.",
          "`(2/3)⁴(1/3)³ = 16/2187`.",
          "`4/7`.",
          "`C(7, 4)(1/2)⁷ = 35/128`."],
      exp: "Exemplo da Seção 6.2. A terceira alternativa trata a moeda como honesta.",
      dica: "Lembre do fator `C(n, k)`." },
    { t: "X", sec: "6.1", q: "Qual a probabilidade de, entre `n` pessoas, pelo menos duas fazerem aniversário no mesmo dia (366 dias equiprováveis)? Quando passa de 1/2?",
      o: ["`1 − (365/366)(364/366)⋯((367 − n)/366)`; passa de 1/2 a partir de `n = 23`.",
          "`n/366`; passa de 1/2 com `n = 183`.",
          "`1 − (365/366)ⁿ`; passa de 1/2 com `n = 254`.",
          "`C(n, 2)/366`; passa de 1/2 com `n = 20`."],
      exp: "Problema do aniversário (Seção 6.2): calcula-se o complemento (todos distintos). O número surpreendentemente pequeno é 23.",
      dica: "Use o complemento: todos diferentes." },
    { t: "X", sec: "6.4", q: "Qual a variância do número de caras em `n` lançamentos de uma moeda com probabilidade `p` de cara?",
      o: ["Soma de `n` indicadoras independentes, cada uma com variância `p(1 − p)`. Resultado: `np(1 − p)`.",
          "`np`.", "`n²p(1 − p)`.", "`p(1 − p)`."],
      exp: "Teorema de Bienaymé: variâncias de independentes somam. `V(Xᵢ) = E(Xᵢ²) − E(Xᵢ)² = p − p²`.",
      dica: "Variância de uma indicadora: `p − p²`." }
  ]
});

// Rosen, Cap. 7 · Técnicas Avançadas de Contagem (Seções 7.1–7.6)
capitulo("rosen", {
  num: 7, nome: "Técnicas Avançadas de Contagem", secoes: "7.1–7.6",
  desc: "Relações de recorrência, recorrências lineares, dividir para conquistar, funções geradoras e inclusão-exclusão.",
  qs: [
    { t: "T", sec: "7.2", q: "Para `aₙ = c₁aₙ₋₁ + c₂aₙ₋₂` com raízes características distintas `r₁ ≠ r₂`, a solução geral é:",
      o: ["`aₙ = α₁r₁ⁿ + α₂r₂ⁿ`, com `α₁, α₂` determinados pelas condições iniciais.",
          "`aₙ = (α₁ + α₂n) r₁ⁿ`.",
          "`aₙ = r₁ⁿ + r₂ⁿ`, sem constantes.",
          "`aₙ = α r₁ⁿ r₂ⁿ`."],
      exp: "A equação característica é `r² − c₁r − c₂ = 0`. A forma `(α₁ + α₂n)r₀ⁿ` é para raiz dupla `r₀`.",
      dica: "Uma potência por raiz." },
    { t: "T", sec: "7.2", q: "Se a equação característica de uma recorrência linear homogênea de ordem 2 tem raiz dupla `r₀`, a solução geral é:",
      o: ["`aₙ = α₁r₀ⁿ + α₂ n r₀ⁿ`", "`aₙ = α₁r₀ⁿ + α₂r₀ⁿ`", "`aₙ = α r₀^(2n)`", "`aₙ = α₁r₀ⁿ + α₂ n²`"],
      exp: "`α₁r₀ⁿ + α₂r₀ⁿ = (α₁ + α₂)r₀ⁿ` tem só uma constante livre e não acomoda duas condições iniciais.",
      dica: "Precisa de duas soluções independentes." },
    { t: "T", sec: "7.3", q: "Pelo teorema mestre, se `f(n) = a f(n/b) + cnᵈ` com `a ≥ 1`, `b > 1`, qual é a ordem quando `a = bᵈ`?",
      o: ["`O(nᵈ log n)`", "`O(nᵈ)`", "`O(n^(log_b a))` com `a < bᵈ`", "`O(log n)` sempre"],
      exp: "Casos: `a < bᵈ` → `O(nᵈ)`; `a = bᵈ` → `O(nᵈ log n)`; `a > bᵈ` → `O(n^(log_b a))`. Mergesort: `a = 2`, `b = 2`, `d = 1` → `O(n log n)`.",
      dica: "Pense no mergesort." },
    { t: "T", sec: "7.5", q: "O princípio da inclusão-exclusão para três conjuntos é:",
      o: ["`|A ∪ B ∪ C| = |A| + |B| + |C| − |A∩B| − |A∩C| − |B∩C| + |A∩B∩C|`",
          "`|A ∪ B ∪ C| = |A| + |B| + |C| − |A∩B∩C|`",
          "`|A ∪ B ∪ C| = |A| + |B| + |C| − |A∩B| − |A∩C| − |B∩C|`",
          "`|A ∪ B ∪ C| = |A|·|B|·|C|`"],
      exp: "Elementos em três conjuntos são somados 3 vezes, subtraídos 3 vezes e somados 1 vez: total 1, como deve ser.",
      dica: "Alterne sinais pelo tamanho das interseções." },
    { t: "T", sec: "7.4", q: "A função geradora da sequência `aₖ = 1` para todo `k ≥ 0` é:",
      o: ["`1/(1 − x)`, válida para `|x| < 1`.", "`1/(1 + x)`", "`eˣ`", "`(1 + x)ⁿ`"],
      exp: "`∑ xᵏ = 1/(1 − x)`. `(1 + x)ⁿ` gera `C(n, k)`; `1/(1 + x)` gera `(−1)ᵏ`.",
      dica: "Série geométrica." },

    { t: "E", sec: "7.2", q: "Resolva `aₙ = aₙ₋₁ + 2aₙ₋₂`, com `a₀ = 2`, `a₁ = 7`.",
      o: ["`r² − r − 2 = 0` → `r = 2, −1`. `aₙ = α₁2ⁿ + α₂(−1)ⁿ`; `α₁ + α₂ = 2`, `2α₁ − α₂ = 7` → `α₁ = 3`, `α₂ = −1`. Resultado: `aₙ = 3·2ⁿ − (−1)ⁿ`.",
          "`r² − r − 2 = 0` → `r = −2, 1`. Resultado: `aₙ = 3(−2)ⁿ − 1`.",
          "`r² + r + 2 = 0` não tem raízes reais; a recorrência não tem solução fechada.",
          "`r = 2, −1`; `α₁ = 2`, `α₂ = 7`. Resultado: `aₙ = 2·2ⁿ + 7(−1)ⁿ`."],
      exp: "Exemplo da Seção 7.2. Confira: `a₂ = 7 + 4 = 11` e `3·4 − 1 = 11`.",
      dica: "Fatore `r² − r − 2`." },
    { t: "E", sec: "7.1", q: "Na Torre de Hanói, `Hₙ = 2Hₙ₋₁ + 1`, `H₁ = 1`. Qual é `Hₙ`?",

    { t: "E", sec: "7.5", q: "Quantos inteiros positivos `≤ 1000` são divisíveis por 7 ou por 11?",

    { t: "E", sec: "7.6", q: "Quantas funções sobrejetoras existem de um conjunto com 6 elementos em um com 3?",

      exp: "Exemplo da Seção 7.6. Subtraem-se as que omitem algum elemento do contradomínio, somando as que omitem dois.",

          "Raiz dupla 3. `aₙ = α3ⁿ`, `α = 1`. Resultado: `aₙ = 3ⁿ` (mas `a₁ = 3 ≠ 6`).",

      dica: "Raiz dupla pede o fator `n`." },
    { t: "X", sec: "7.6", q: "Quantos desarranjos (permutações sem ponto fixo) existem de 4 elementos?",
      o: ["`D₄ = 4!(1 − 1/1! + 1/2! − 1/3! + 1/4!) = 24 − 24 + 12 − 4 + 1 = 9`.",
          "`4! − 4 = 20`.",
          "`3! = 6`.",
          "`4!/e ≈ 8,83`, logo 8."],
      exp: "Fórmula da Seção 7.6. `n!/e` arredondado ao inteiro mais próximo dá 9, não truncado.",
      dica: "Inclusão-exclusão sobre os pontos fixos." },
    { t: "X", sec: "7.3", q: "Na busca binária, `f(n) = f(n/2) + 2`. Qual é a ordem de `f`?",
      o: ["Teorema mestre com `a = 1`, `b = 2`, `d = 0`: `a = bᵈ = 1`, logo `O(n⁰ log n) = O(log n)`.",
          "`a = 1 < bᵈ`, logo `O(1)`.",
          "`O(n)`, pois soma 2 a cada nível.",
          "`O(n log n)`."],

  ]

// Rosen, Cap. 8 · Relações (Seções 8.1–8.6)
capitulo("rosen", {
  num: 8, nome: "Relações", secoes: "8.1–8.6",
  desc: "Propriedades de relações, relações n-árias, representação por matriz e grafo, fechos, equivalência e ordens parciais.",
  qs: [
    { t: "T", sec: "8.1", q: "Uma relação `R` em `A` é antissimétrica quando:",
      o: ["`∀a ∀b ((a, b) ∈ R ∧ (b, a) ∈ R → a = b)`.",
          "`∀a ∀b ((a, b) ∈ R → (b, a) ∉ R)`.",
          "Não é simétrica.",
          "`∀a ((a, a) ∉ R)`."],
      exp: "A segunda é assimetria (proíbe também laços). Antissimetria permite `(a, a)`. Uma relação pode ser simétrica e antissimétrica ao mesmo tempo (ex.: a igualdade) ou nenhuma das duas.",
      dica: "Ida e volta só com elementos iguais." },
    { t: "T", sec: "8.1", q: "Quantas relações reflexivas existem em um conjunto com `n` elementos?",
      o: ["`2^(n(n−1))`: os `n` pares `(a, a)` são obrigatórios e os `n² − n` restantes são livres.",
          "`2^(n²)`.", "`2ⁿ`.", "`2^(n(n+1)/2)`."],
      exp: "`2^(n²)` conta todas as relações. `2^(n(n+1)/2)` é o número de relações simétricas.",
      dica: "Alguns pares são obrigatórios." },
    { t: "T", sec: "8.5", q: "Qual é a relação entre relações de equivalência e partições?",
      o: ["As classes de equivalência de `R` formam uma partição de `A`; reciprocamente, toda partição de `A` define uma relação de equivalência.",
          "Toda relação reflexiva induz uma partição.",
          "As classes de equivalência podem se sobrepor parcialmente.",
          "Só relações em conjuntos finitos induzem partições."],
      exp: "Teorema da Seção 8.5: `[a] = [b]` ou `[a] ∩ [b] = ∅`, e a união das classes é `A`.",
      dica: "Classes nunca se sobrepõem parcialmente." },
    { t: "T", sec: "8.6", q: "Um conjunto parcialmente ordenado (poset) `(S, ≼)` exige que `≼` seja:",
      o: ["Reflexiva, antissimétrica e transitiva.", "Reflexiva, simétrica e transitiva.", "Irreflexiva e transitiva apenas.", "Total, ou seja, todo par é comparável."],
      exp: "A segunda é equivalência. Ordem total (linear) é um caso particular em que todos os pares são comparáveis; em geral, não são (ex.: divisibilidade: 2 e 3).",
      dica: "Pense em `⊆` ou em `|`." },
    { t: "T", sec: "8.4", q: "O fecho transitivo `R*` de `R` é:",
      o: ["A conectividade `⋃_{n≥1} Rⁿ`: `(a, b) ∈ R*` se há um caminho de `a` até `b` no grafo de `R`.",
          "`R ∪ R⁻¹`.",
          "`R ∪ Δ`, com `Δ` a diagonal.",
          "`R²`."],
      exp: "`R ∪ R⁻¹` é o fecho simétrico; `R ∪ Δ`, o reflexivo. Para `|A| = n`, basta `R ∪ R² ∪ ⋯ ∪ Rⁿ` (Warshall calcula em `O(n³)`).",
      dica: "Caminhos de qualquer comprimento." },
    { t: "T", sec: "8.3", q: "Se `M_R` é a matriz booleana de `R`, como se reconhece pela matriz que `R` é simétrica?",
      o: ["`M_R = (M_R)ᵀ`.", "A diagonal é toda 1.", "`M_R ⊙ M_R = M_R`.", "`M_R ∧ (M_R)ᵀ` só tem 1 na diagonal."],
      exp: "A diagonal toda 1 indica reflexividade. A última condição caracteriza antissimetria.",
      dica: "Simetria em relação à diagonal." },

    { t: "E", sec: "8.5", q: "Mostre que a congruência módulo `m` (`a R b ⇔ m | a − b`) é uma relação de equivalência em `ℤ`.",
      o: ["Reflexiva: `m | 0`. Simétrica: `a − b = km ⇒ b − a = (−k)m`. Transitiva: `a − b = km`, `b − c = lm ⇒ a − c = (k + l)m`.",
          "Reflexiva: `m | a`. Simétrica: `m | a ⇒ m | b`. Transitiva: segue da simétrica.",
          "Reflexiva, antissimétrica e transitiva, como a divisibilidade.",
          "Basta mostrar que é reflexiva e simétrica; a transitividade é consequência."],
      exp: "Exemplo da Seção 8.5. A transitividade não decorre das outras duas (ex.: “estar a distância ≤ 1”).",
      dica: "Use a definição `a − b = km`." },
    { t: "E", sec: "8.4", q: "Encontre o fecho transitivo de `R = {(1,3), (1,4), (2,1), (3,2)}` em `{1, 2, 3, 4}`.",
      o: ["Caminhos: `1→3→2→1`, então 1, 2, 3 alcançam todos de `{1,2,3,4}`; 4 não alcança ninguém. `R* = {(i, j) : i ∈ {1,2,3}, j ∈ {1,2,3,4}}`, 12 pares.",
          "`R* = R ∪ {(1,2), (2,3), (3,1)}`.",
          "`R* = R ∪ {(1,1), (2,2), (3,3), (4,4)}`.",
          "`R* = A × A`."],
      exp: "Exemplo da Seção 8.4. `(4, j)` nunca entra porque 4 não tem arestas de saída.",
      dica: "Desenhe o grafo e veja o ciclo." },
    { t: "E", sec: "8.6", q: "No poset `({2, 4, 5, 10, 12, 20, 25}, |)`, quais são os elementos maximais e minimais?",
      o: ["Maximais: 12, 20, 25 (nada que os divida propriamente está acima). Minimais: 2, 5.",
          "Maximal: 25 (o maior). Minimal: 2 (o menor).",
          "Maximais: 20, 25. Minimais: 2, 4, 5.",
          "Não há maximais, pois o poset não é total."],
      exp: "Exemplo da Seção 8.6. 12 é maximal porque nenhum outro elemento do conjunto é múltiplo de 12. 4 não é minimal, pois `2 | 4`.",
      dica: "Maximal ≠ maior; use a relação, não o tamanho." },

    { t: "X", sec: "8.1", q: "Quais propriedades tem a relação “divide” em `ℤ⁺`?",
      o: ["Reflexiva (`a | a`), antissimétrica (`a | b`, `b | a` ⇒ `a = b` em `ℤ⁺`) e transitiva; não é simétrica (`1 | 2`, `2 ∤ 1`).",
          "Reflexiva, simétrica e transitiva.",
          "Só transitiva.",
          "Reflexiva e simétrica, mas não transitiva."],
      exp: "Exemplo da Seção 8.1. Em `ℤ` (com negativos) não seria antissimétrica: `1 | −1` e `−1 | 1`.",
      dica: "Teste `1` e `2`." },
    { t: "X", sec: "8.1", q: "Quantas relações simétricas há em um conjunto com `n` elementos?",
      o: ["Escolhem-se livremente os `n` pares diagonais e os `C(n, 2)` pares `{a, b}` não ordenados: `2^(n + n(n−1)/2) = 2^(n(n+1)/2)`.",
          "`2^(n²)/2`.", "`2^(C(n, 2))`.", "`2ⁿ`."],
      exp: "Em uma relação simétrica, `(a, b)` e `(b, a)` entram juntos, então só se decide uma vez por par não ordenado.",
      dica: "Cada par fora da diagonal é decidido junto com seu espelho." },
    { t: "X", sec: "8.5", q: "Quais são as classes de equivalência da congruência módulo 4 em `ℤ`?",
      o: ["`[0] = {…, −4, 0, 4, 8, …}`, `[1] = {…, −3, 1, 5, …}`, `[2] = {…, −2, 2, 6, …}`, `[3] = {…, −1, 3, 7, …}`: 4 classes.",
          "Infinitas classes, uma para cada inteiro.",
          "Duas classes: pares e ímpares.",
          "`[0]`, `[1]`, `[2]`, `[3]`, `[4]`: 5 classes."],
      exp: "`[4] = [0]`. As classes são `ℤ₄`.",
      dica: "Restos possíveis da divisão por 4." }
  ]
});

    { t: "T", sec: "9.5", q: "O teorema de Dirac garante circuito de Hamilton em um grafo simples com `n ≥ 3` vértices quando:",

          "O grafo é conexo.",
          "O grafo é bipartido."],

    { t: "T", sec: "9.7", q: "Para um grafo planar simples e conexo com `v ≥ 3` vértices e `e` arestas, vale:",

    { t: "X", sec: "9.5", q: "Para quais `m, n ≥ 1` o grafo `Kₘ,ₙ` tem circuito de Euler?",

  ]
