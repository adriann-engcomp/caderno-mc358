// Rosen, Cap. 11 · Álgebra Booleana (Seções 11.1–11.4)
capitulo("rosen", {
  num: 11, nome: "Álgebra Booleana", secoes: "11.1–11.4",
  desc: "Funções e identidades booleanas, dualidade, forma de soma de produtos, completude funcional, portas lógicas e mapas de Karnaugh.",
  qs: [
    { t: "T", sec: "11.1", q: "Quantas funções booleanas de grau `n` existem?",
      o: ["`2^(2ⁿ)`: há `2ⁿ` linhas na tabela e 2 valores possíveis em cada.",
          "`2ⁿ`.", "`n²`.", "`2^(n²)`."],
      exp: "Para `n = 2` são 16 funções.",
      dica: "Cada linha da tabela é uma escolha livre." },
    { t: "T", sec: "11.1", q: "O dual de uma expressão booleana é obtido:",
      o: ["Trocando `+` por `·`, `·` por `+`, `0` por `1` e `1` por `0`, sem complementar as variáveis.",
          "Complementando todas as variáveis.",
          "Complementando a expressão inteira.",
          "Invertendo a ordem dos termos."],
      exp: "Princípio da dualidade: se uma identidade vale, sua dual também vale. Ex.: o dual de `x(y + 0)` é `x + y·1`.",
      dica: "Troque operações e constantes." },
    { t: "T", sec: "11.2", q: "Por que `{↓}` (NOR) sozinho é funcionalmente completo?",
      o: ["Porque `x̄ = x ↓ x` e `x + y = (x ↓ y) ↓ (x ↓ y)`, e `{+, ‾}` já é completo (De Morgan dá o produto).",
          "Porque toda porta é NOR internamente.",
          "Porque NOR tem tabela simétrica.",
          "Não é completo; precisa de NAND junto."],
      exp: "Seção 11.2. O mesmo vale para `{|}` (NAND).",
      dica: "Obtenha a negação primeiro." },
    { t: "T", sec: "11.2", q: "O que é a forma normal disjuntiva (soma de produtos) de uma função booleana?",
      o: ["A soma (OR) dos mintermos correspondentes às linhas em que a função vale 1.",
          "O produto dos maxtermos das linhas em que a função vale 1.",
          "A expressão com menor número de literais.",
          "A soma das variáveis que aparecem na função."],
      exp: "Cada mintermo é um produto de todos os literais (`xᵢ` ou `x̄ᵢ`) e vale 1 em exatamente uma linha. Não é necessariamente mínima.",
      dica: "Um mintermo por linha que dá 1." },
    { t: "T", sec: "11.4", q: "No mapa de Karnaugh, por que se agrupam células adjacentes em blocos de tamanho potência de 2?",
      o: ["Porque células adjacentes diferem em um literal, e a combinação `xy + xȳ = x` elimina-o; um bloco de `2ᵏ` células elimina `k` literais.",
          "Por convenção visual.",
          "Porque o mapa tem sempre `2ⁿ` células.",
          "Para contar as linhas da tabela que dão 0."],
      exp: "O código de Gray na borda garante que vizinhos (inclusive nas bordas opostas) diferem em um só bit.",
      dica: "`x(y + ȳ) = x`." },

    { t: "E", sec: "11.2", q: "Encontre a soma de produtos de `F(x, y, z) = (x + y)z̄`.",
      o: ["`F = 1` quando `z = 0` e `x + y = 1`: linhas `(1,1,0)`, `(1,0,0)`, `(0,1,0)`. `F = xyz̄ + xȳz̄ + x̄yz̄`.",
          "Distribuindo: `F = xz̄ + yz̄`, que já é a forma canônica.",
          "`F = xyz + xyz̄ + x̄yz̄`.",
          "`F = x + y + z̄`."],
      exp: "Exemplo da Seção 11.2. `xz̄ + yz̄` é uma soma de produtos, mas não a canônica (os termos não têm todas as variáveis).",
      dica: "Monte a tabela e pegue as linhas com 1." },
    { t: "E", sec: "11.3", q: "Projete um circuito que dê a maioria de 3 votos `x, y, z` (saída 1 se pelo menos dois votam 1).",
      o: ["A saída é 1 se algum par vota 1: `xy + xz + yz`, com três portas AND e uma OR.",
          "`x + y + z`.",
          "`xyz`.",
          "`x ⊕ y ⊕ z`."],
      exp: "Exemplo da Seção 11.3. A soma de produtos canônica tem 4 mintermos, que se simplificam para `xy + xz + yz`.",
      dica: "Basta um par concordar em 1." },
    { t: "E", sec: "11.3", q: "Um meio-somador soma dois bits `x` e `y`. Quais são as saídas?",
      o: ["Soma `s = x ⊕ y = xȳ + x̄y` e vai-um `c = xy`.",
          "`s = x + y` e `c = xy`.",
          "`s = xy` e `c = x ⊕ y`.",
          "`s = x ⊕ y` e `c = x + y`."],
      exp: "Exemplo da Seção 11.3. Com `x = y = 1`: soma 0 e vai-um 1 (`1 + 1 = 10₂`).",
      dica: "`1 + 1 = 10` em binário." },

    { t: "X", sec: "11.4", q: "Simplifique `xyz + xyz̄ + xȳz + xȳz̄` com o mapa de Karnaugh.",
      o: ["As quatro células formam a linha `x = 1` inteira; eliminam-se `y` e `z`. Resultado: `x`.",
          "`xy + xȳ`.", "`xz + xz̄`.", "`xyz`."],
      exp: "Algebricamente: `xy(z + z̄) + xȳ(z + z̄) = xy + xȳ = x`.",
      dica: "Todos os termos com `x`, em todas as combinações de `y, z`." },
    { t: "X", sec: "11.1", q: "Prove a lei de absorção `x(x + y) = x` usando identidades.",
      o: ["`x(x + y) = (x + 0)(x + y) = x + 0·y = x + 0 = x` (identidade, distributiva de `+` sobre `·`, dominação, identidade).",
          "`x(x + y) = xx + xy = x + xy`, e `xy = 0`, logo `x`.",
          "Por idempotência, `x(x + y) = x + y`.",
          "Basta testar `x = 1`, `y = 0`."],
      exp: "Exemplo da Seção 11.1. `xy` não é 0 em geral. Uma prova também pode ser feita pela tabela-verdade completa (4 linhas), não por um caso só.",
      dica: "`x = x + 0` e distributiva." },
    { t: "X", sec: "11.2", q: "Exprima `x + y` usando só a porta NAND `|`.",
      o: ["`x + y = (x | x) | (y | y)`, pois `x | x = x̄` e `x̄ | ȳ = ¬(x̄ȳ) = x + y`.",
          "`x + y = x | y`.",
          "`x + y = (x | y) | (x | y)`.",
          "`x + y = x̄ | y`."],
      exp: "`(x | y) | (x | y)` dá `xy`, não `x + y`.",
      dica: "De Morgan: `x + y = ¬(x̄ȳ)`." }
  ]
});

// ---------- Utilidades ----------
const $ = s => document.querySelector(s);
const view = $("#view");
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
// Dentro de `...`: _{..} vira subscrito; ^{..} e ^(..) (parênteses balanceados) viram sobrescrito
function mat(s) {
  let out = "", i = 0;
  while (i < s.length) {
    const c = s[i], d = s[i + 1];
    if ((c === "_" || c === "^") && (d === "{" || (c === "^" && d === "("))) {
      const fecha = d === "{" ? "}" : ")";
      let j = i + 2, prof = 1;
      while (j < s.length && prof) { if (s[j] === d) prof++; else if (s[j] === fecha) prof--; j++; }
      if (!prof) { const tagn = c === "_" ? "sub" : "sup"; out += `<${tagn}>${mat(s.slice(i + 2, j - 1))}</${tagn}>`; i = j; continue; }
    }
    out += c; i++;
  }
  return out;
}
const fmt = s => esc(s).replace(/`([^`]+)`/g, (_, m) => `<span class="m">${mat(m)}</span>`);
const embaralhar = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const sorteio = a => a[Math.floor(Math.random() * a.length)];
const passa = (q, f) => f === "todos" || (f === "EX" ? q.t !== "T" : q.t === f);
function nivel(xp) {
  let i = 0; while (i + 1 < NIVEIS.length && xp >= NIVEIS[i + 1][0]) i++;
  return { i, nome: NIVEIS[i][1], ini: NIVEIS[i][0], prox: NIVEIS[i + 1] };
}
function estrelasHTML(n, cls = "stars") {

}

// ---------- Som (WebAudio, sem arquivos) ----------
let ctxAudio = null;
function tom(freqs, dur = 0.09, tipo = "sine") {
  if (!S.som) return;
  try {
    ctxAudio = ctxAudio || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach((f, k) => {
      const o = ctxAudio.createOscillator(), g = ctxAudio.createGain(), t0 = ctxAudio.currentTime + k * dur;
      o.type = tipo; o.frequency.value = f; g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.12, t0 + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g).connect(ctxAudio.destination); o.start(t0); o.stop(t0 + dur + 0.02);
    });
  } catch (e) {}
}
const somAcerto = () => tom([660, 880]);
const somErro = () => tom([220, 180], 0.12, "triangle");
const somFim = () => tom([523, 659, 784, 1046], 0.11);

// ---------- Confete ----------
function confete() {
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  const cv = $("#confetti"), cx = cv.getContext("2d");
  cv.width = innerWidth; cv.height = innerHeight;
  const cores = ["#5b2fb0", "#e8a91a", "#1f8a5b", "#c9302c", "#1d5fa8"];
  const ps = Array.from({ length: 140 }, () => ({ x: Math.random() * cv.width, y: -20 - Math.random() * cv.height * 0.4, vx: (Math.random() - 0.5) * 3, vy: 2 + Math.random() * 3, r: 4 + Math.random() * 5, c: sorteio(cores), a: Math.random() * 6 }));
  let f = 0;
  (function passo() {
    cx.clearRect(0, 0, cv.width, cv.height);
    ps.forEach(p => { p.x += p.vx; p.y += p.vy; p.a += 0.1; cx.fillStyle = p.c; cx.save(); cx.translate(p.x, p.y); cx.rotate(p.a); cx.fillRect(-p.r / 2, -p.r / 4, p.r, p.r / 2); cx.restore(); });
    if (++f < 160) requestAnimationFrame(passo); else cx.clearRect(0, 0, cv.width, cv.height);
  })();
}
function flutuarXP(el, n) {
  const r = el.getBoundingClientRect(), d = document.createElement("div");
  d.className = "floatxp"; d.textContent = "+" + n + " XP";

}

let Q = null;
function iniciar(cfg) {

  Q = Object.assign({ i: 0, acertos: 0, xp: 0, combo: 0, res: [], erradas: [] }, cfg);

}
function prepararQuestao() {
  const q = Q.qs[Q.i];
  Q.ordem = embaralhar([0, 1, 2, 3].slice(0, q.o.length));
  Q.respondida = false; Q.dica = false;
}
function telaQuestao() {
  if (Q.ordem === undefined || Q.prep !== Q.i) { prepararQuestao(); Q.prep = Q.i; }
  const q = Q.qs[Q.i], sim = Q.modo === "simulado";
  view.innerHTML = `

    <article class="sheet" id="sheet">
      <div class="qmeta"><span>${esc(q.livro.curto)} · Cap. ${q.cap.num} · Seção ${esc(q.sec)}</span>${tag(q.t)}</div>
      <p class="qtext"><span class="qnum">${Q.i + 1}.</span>${fmt(q.q)}</p>
      ${q.t !== "T" ? `<p class="lead">Escolha a alternativa cujo processo de resolução e resultado estão ambos corretos.</p>` : ""}
      <div class="opts" id="opts">
        ${Q.ordem.map((k, j) => `<button class="opt" type="button" data-k="${k}"><span class="l">${"ABCD"[j]}</span><span class="t">${fmt(q.o[k])}</span></button>`).join("")}
      </div>
      <div id="hintbox"></div>
      <div id="fb"></div>
      <div class="actions">
        <span class="combo ${Q.combo >= 3 ? "hot" : ""}" id="combo">${Q.combo >= 2 ? "Combo ×" + Q.combo : ""}</span>
        <div class="row">
          ${sim || !q.dica ? "" : `<button class="btn ghost" type="button" id="btn-dica">Dica (H)</button>`}
          <button class="btn" type="button" id="btn-prox" hidden>${Q.i + 1 < Q.qs.length ? "Próxima" : "Ver resultado"} (Enter)</button>
        </div>
      </div>
    </article>`;
  $("#btn-sair").onclick = sair;
  view.querySelectorAll(".opt").forEach(b => b.onclick = () => responder(+b.dataset.k, b));
  const bd = $("#btn-dica"); if (bd) bd.onclick = mostrarDica;
  $("#btn-prox").onclick = proxima;
}
function mostrarDica() {
  if (!Q || Q.respondida || Q.dica || Q.modo === "simulado") return;
  const q = Q.qs[Q.i]; if (!q.dica) return;
  Q.dica = true;
  $("#hintbox").innerHTML = `<div class="hint"><b>Dica:</b> ${fmt(q.dica)}</div>`;
  const bd = $("#btn-dica"); if (bd) bd.disabled = true;
}
function responder(k, el) {
  if (!Q || Q.respondida) return;
  Q.respondida = true;
  const q = Q.qs[Q.i], certo = k === 0;
  view.querySelectorAll(".opt").forEach(b => {
    b.disabled = true;
    if (+b.dataset.k === 0) b.classList.add("right");
    else if (b === el) b.classList.add("wrong");
  });
  Q.res[Q.i] = certo;
  let ganho = 0;
  if (certo) {
    Q.acertos++; Q.combo++;
    ganho = (q.t === "T" ? 10 : 15);
    if (Q.dica) ganho = Math.ceil(ganho / 2);
    ganho += Math.min(Q.combo - 1, 5) * 2;
    S.xp += ganho; Q.xp += ganho;
    S.melhorCombo = Math.max(S.melhorCombo, Q.combo);
    S.res[q.id] = 1;
    somAcerto(); flutuarXP(el, ganho);
  } else {
    Q.combo = 0; Q.erradas.push(q);
    S.res[q.id] = 0; S.erros[q.id] = (S.erros[q.id] || 0) + 1;
    somErro(); $("#sheet").classList.add("shake");
  }
  salvar(); hud(); abas();
  $("#fb").innerHTML = `<div class="feedback ${certo ? "good" : "bad"}">
      <span class="who">${certo ? sorteio(ACERTOS) : sorteio(ERROS)}</span>
      ${fmt(q.exp)}
    </div>
    <div class="ref"><b>Fonte:</b> ${fonte(q)}</div>`;
  $("#combo").textContent = Q.combo >= 2 ? "Combo ×" + Q.combo : "";
  $("#combo").className = "combo" + (Q.combo >= 3 ? " hot" : "");
  const bd = $("#btn-dica"); if (bd) bd.hidden = true;
  const bp = $("#btn-prox"); bp.hidden = false; bp.focus({ preventScroll: true });
}
function proxima() {
  if (!Q || !Q.respondida) return;
  Q.i++;
  if (Q.i >= Q.qs.length) { telaResultado(); return; }
  render(); scrollTo({ top: 0, behavior: "smooth" });
}
function sair() { Q = null; render(); }
function telaResultado() {
  const n = Q.qs.length, pct = Q.acertos / n;
  const est = pct >= 0.9 ? 3 : pct >= 0.7 ? 2 : pct >= 0.5 ? 1 : 0;
  if (Q.capKey) { S.estrelas[Q.capKey] = Math.max(S.estrelas[Q.capKey] || 0, est); salvar(); }
  const frase = est === 3 ? "Demonstração completa!" : est === 2 ? "Quase lá, falta pouco." : est === 1 ? "Passou no caso base." : "Vale revisar a teoria.";
  const nota = (pct * 10).toFixed(1).replace(".", ",");
  const fim = Q; Q = { fim: true };
  view.innerHTML = `<article class="sheet result">
    <div class="bigstars">${[1, 2, 3].map(k => `<span class="${k <= est ? "on" : ""}">★</span>`).join("")}</div>
    <h2>${frase}</h2>
    <p>${esc(fim.titulo)}</p>
    <div class="stats">
      <div class="stat"><b>${fim.acertos}/${n}</b><span>Acertos</span></div>
      <div class="stat"><b>${nota}</b><span>Nota</span></div>
      <div class="stat"><b>+${fim.xp}</b><span>XP</span></div>
    </div>
    <div class="row">
      ${fim.erradas.length ? `<button class="btn" type="button" id="r-erros">Refazer os ${fim.erradas.length} erros</button>` : ""}
      <button class="btn ghost" type="button" id="r-de-novo">Refazer tudo</button>
      <button class="btn ghost" type="button" id="r-voltar">Voltar</button>
    </div>
    ${fim.erradas.length ? `<div class="qlist" style="width:100%;text-align:left;margin-top:12px">${fim.erradas.map(q => `<div class="qrow" style="cursor:default"><span class="qt">${fmt(q.q)}</span><span class="side">${tag(q.t)} ${esc(q.livro.curto)} §${esc(q.sec)}</span></div>`).join("")}</div>` : ""}
  </article>`;
  if (est === 3) confete();
  somFim();
  const re = $("#r-erros"); if (re) re.onclick = () => iniciar({ titulo: fim.titulo + " · erros", qs: embaralhar(fim.erradas), modo: fim.modo === "simulado" ? "erros" : fim.modo });
  $("#r-de-novo").onclick = () => iniciar({ titulo: fim.titulo, qs: fim.modo === "cap" ? fim.qs : embaralhar(fim.qs), capKey: fim.capKey, modo: fim.modo });
  $("#r-voltar").onclick = sair;
}

// ---------- Render ----------
function render() {
  hud(); abas();
  if (Q && Q.fim) return;
  if (Q) { telaQuestao(); return; }
  if (S.aba === "erros") telaErros();
  else if (S.aba === "simulado") telaSimulado();
  else telaLivro(LIVROS[S.aba] || LIVROS.rosen);
}

document.addEventListener("keydown", e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "Escape") { if (Q) sair(); return; }
  if (!Q || Q.fim) return;
  const k = e.key.toLowerCase();
  const idx = "1234".indexOf(k) >= 0 ? "1234".indexOf(k) : "abcd".indexOf(k);
  if (!Q.respondida && idx >= 0 && k.length === 1) {
    const b = view.querySelectorAll(".opt")[idx]; if (b) { e.preventDefault(); b.click(); }
  } else if (k === "h") mostrarDica();
  else if (e.key === "Enter" && Q.respondida) { e.preventDefault(); proxima(); }
});
$("#home").onclick = () => { Q = null; render(); };
$("#btn-som").onclick = () => { S.som = !S.som; salvar(); hud(); };
$("#btn-tema").onclick = () => { S.tema = ({ auto: "light", light: "dark", dark: "auto" })[S.tema]; salvar(); aplicarTema(); hud(); };
aplicarTema();
render();
</script>
<script>if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));</script>
</body>
</html>
